<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A62">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Plantilla Personal de Finanzas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra fija con año, tema y pestañas por mes; debajo, resumen anual o el detalle de un mes con los mismos apartados de la hoja */
:root{
  --bg:#EBEFED; --surface:#FFFFFF; --surface-2:#F3F6F4; --ink:#14201B; --muted:#5B6862; --line:#D8DFDB;
  --accent:#0B7A62; --on-accent:#FFFFFF; --accent-soft:#D3EBE4;
  --c-ing:#2F6BDA; --c-gas:#E2703A; --c-aho:#14A06F; --c-inv:#7557D8; --c-res:#9AA59F; --c-fij:#3B6FD4; --c-hor:#E2703A;
  --bad:#B3261E; --bad-bg:#F8DAD7; --ok:#1C6B3C; --ok-bg:#D6EEDF; --warn:#7A5410; --warn-bg:#F7E9C6;
  --h-ing:#2E9C8A; --h-pre:#D4B21E; --h-fij:#D9677F; --h-hor:#8E7BD0; --h-bbva:#1A2A9B; --h-bcp:#2848E6; --h-oh:#7B7B7B; --h-aho:#E8956B; --h-inv:#3E9E4F; --h-eur:#6D8FB5;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#17211D; --surface-2:#1E2A25; --ink:#E7EEEA; --muted:#98A8A0; --line:#2C3B35;
  --accent:#3CC9A6; --on-accent:#06251D; --accent-soft:#1B3A31;
  --c-ing:#5B93F0; --c-gas:#F28A57; --c-aho:#3CC596; --c-inv:#9A82F0; --c-res:#6E7C75; --c-fij:#6B96F0; --c-hor:#F28A57;
  --bad:#F2A29C; --bad-bg:#3F1E1C; --ok:#8FDDAE; --ok-bg:#1B3A28; --warn:#E9CF86; --warn-bg:#3A3014;
  --h-ing:#3FB8A3; --h-pre:#D9BC3A; --h-fij:#E27A91; --h-hor:#A394E0; --h-bbva:#3345C9; --h-bcp:#4A6BFF; --h-oh:#8A8A8A; --h-aho:#EE9F78; --h-inv:#4FB562; --h-eur:#7FA3CC;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#17211D; --surface-2:#1E2A25; --ink:#E7EEEA; --muted:#98A8A0; --line:#2C3B35;
  --accent:#3CC9A6; --on-accent:#06251D; --accent-soft:#1B3A31;
  --c-ing:#5B93F0; --c-gas:#F28A57; --c-aho:#3CC596; --c-inv:#9A82F0; --c-res:#6E7C75; --c-fij:#6B96F0; --c-hor:#F28A57;
  --bad:#F2A29C; --bad-bg:#3F1E1C; --ok:#8FDDAE; --ok-bg:#1B3A28; --warn:#E9CF86; --warn-bg:#3A3014;
  --h-ing:#3FB8A3; --h-pre:#D9BC3A; --h-fij:#E27A91; --h-hor:#A394E0; --h-bbva:#3345C9; --h-bcp:#4A6BFF; --h-oh:#8A8A8A; --h-aho:#EE9F78; --h-inv:#4FB562; --h-eur:#7FA3CC;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
.wrap{max-width:1560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:600 13px var(--font-num);flex:none}
.bt{font:600 18px var(--font-display);letter-spacing:-.01em}
.ctl{display:flex;gap:8px;align-items:center}
select,input,button{font-family:inherit;color:var(--ink)}
select,.ctl button{height:34px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:0 10px;font-size:13px;cursor:pointer}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.tab{flex:none;padding:6px 12px;border-radius:8px;font-weight:500;font-size:13px;color:var(--muted)}
@media (hover:hover) and (pointer:fine){.tab:hover{background:var(--surface-2);color:var(--ink)}}
.tab.off{opacity:.55}
.tab[aria-current="page"]{background:var(--accent);color:var(--on-accent);opacity:1}

main{padding-block:22px 48px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font:700 30px/1.1 var(--font-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin-top:4px}
h2{font:600 15px var(--font-display);margin:0}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.nav{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.nav.dis{opacity:.35}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cb{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kl{font-size:12px;color:var(--muted)}
.kv{font:500 20px var(--font-num);font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.ks{font-size:12px;color:var(--muted);margin-top:2px}
.kv.neg{color:var(--bad)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-bottom:16px}
.cw{position:relative;height:230px}
.cw.s{height:190px}
.cap{font-size:12px;color:var(--muted);margin:2px 0 8px}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.empty{display:grid;place-items:center;min-height:150px;text-align:center;color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:10px}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px;margin-bottom:16px}
.mcard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
@media (hover:hover) and (pointer:fine){.mcard:hover{border-color:var(--accent)}}
.mcard.off{opacity:.55}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.mh b{font:600 15px var(--font-display)}
.mv{font:500 17px var(--font-num);font-variant-numeric:tabular-nums}
.pbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);margin:8px 0 6px}
.pbar span{display:block;height:100%}
.ms{font-size:12px;color:var(--muted)}

.fond{display:flex;align-items:baseline;gap:10px;margin:4px 0 10px}
.fond b{font:600 34px var(--font-display);letter-spacing:-.02em}
.meter{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter div{height:100%;background:var(--c-aho);border-radius:6px}
.hm7{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:36px;gap:4px;align-content:start}
.hmhead{text-align:center;font-size:11px;color:var(--muted);padding-bottom:2px}
.hmcell{height:36px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center}
.hmcell span{font-size:11px;color:var(--muted)}
.hmcell.on span{color:var(--fg);font-weight:600}
.hmcell.empty{border:none;background:transparent!important}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.cfg label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px 4px 2px 10px;font-size:12px}
.chip button{border:none;background:none;cursor:pointer;color:var(--muted);width:20px;height:20px;border-radius:6px}

input[type=text],input[type=number],select.f{height:32px;width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:0 8px;font-size:13px}
input[type=number]{font-family:var(--font-num);text-align:right}
button.b{height:34px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:13px;font-weight:500}
button.b.p{background:var(--accent);color:var(--on-accent);border-color:transparent}
@media (hover:hover) and (pointer:fine){button.b:hover{border-color:var(--accent)}}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.qa input{flex:1;min-width:200px;height:38px}
.qm{font-size:12px;color:var(--muted);min-height:18px;margin-bottom:14px}
.qm.err{color:var(--bad)}

.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
@media (min-width:900px){.span2{grid-column:span 2}}
.sh{display:flex;align-items:center;gap:8px;padding:10px 14px;font:600 14px var(--font-display);background:color-mix(in srgb,var(--h) 16%,var(--surface));border-bottom:1px solid var(--line)}
.sh i{width:10px;height:10px;border-radius:3px;background:var(--h);flex:none}
.sh.solid{background:var(--h);color:#fff}
.sh.solid i{display:none}
.tb{overflow-x:auto;padding:12px 14px 6px}
.rw{display:grid;gap:6px;align-items:center;margin-bottom:6px;min-width:330px}
.rw.lb{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.x{width:22px;height:28px;border:none;background:none;color:var(--muted);cursor:pointer;border-radius:6px;font-size:14px;padding:0}
@media (hover:hover) and (pointer:fine){.x:hover{color:var(--bad)}}
.add{margin:0 14px 12px;height:30px;font-size:12px}
.tot{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-weight:600;background:var(--surface-2)}
.tot span:last-child{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.pr{margin-bottom:12px}
.pr .l{display:flex;align-items:center;gap:8px}
.pr .l span:first-child{flex:1}
.pr input{width:60px}
.pr .bar{height:8px;border-radius:4px;background:var(--surface-2);margin:6px 0 2px;overflow:hidden}
.pr .bar div{height:100%;width:0;border-radius:4px}
.note{font-size:12px;color:var(--muted);padding:0 14px 10px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Sistema de diseño: escalas, elevación, movimiento y estados ===== */
:root{
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sh-1:0 1px 2px rgba(20,32,27,.06),0 1px 1px rgba(20,32,27,.04);
  --sh-2:0 6px 18px rgba(20,32,27,.10);
  --sh-3:0 14px 36px rgba(20,32,27,.20);
  --dur:160ms; --ease:cubic-bezier(.2,.7,.2,1);
  --glow:color-mix(in srgb,var(--accent) 22%,transparent);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sh-1:0 1px 2px rgba(0,0,0,.35);--sh-2:0 6px 18px rgba(0,0,0,.40);--sh-3:0 14px 36px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--sh-1:0 1px 2px rgba(0,0,0,.35);--sh-2:0 6px 18px rgba(0,0,0,.40);--sh-3:0 14px 36px rgba(0,0,0,.55)}

body{background:radial-gradient(1200px 420px at 85% -120px,var(--glow),transparent 70%),var(--bg)}
main{padding-block:var(--sp-5) 56px}
.card{border-radius:var(--r-lg);box-shadow:var(--sh-1);transition:box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.kpi{border-radius:var(--r-md);box-shadow:var(--sh-1);position:relative;overflow:hidden;padding-top:15px}
.kpi::before{content:"";position:absolute;left:14px;top:0;width:30px;height:4px;border-radius:0 0 4px 4px;background:var(--accent)}
#app[data-v="r"] .kpi:nth-child(1)::before{background:var(--c-gas)}
#app[data-v="r"] .kpi:nth-child(2)::before{background:var(--c-aho)}
#app[data-v="r"] .kpi:nth-child(3)::before{background:var(--c-inv)}
#app[data-v="m"] .kpi:nth-child(1)::before{background:var(--c-ing)}
#app[data-v="m"] .kpi:nth-child(2)::before{background:var(--c-gas)}
#app[data-v="m"] .kpi:nth-child(3)::before{background:var(--c-inv)}
#app[data-v="m"] .kpi:nth-child(4)::before{background:var(--c-aho)}
#app[data-v="m"] .kpi:nth-child(5)::before{background:var(--c-res)}
.mcard{border-radius:var(--r-md);box-shadow:var(--sh-1);transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
@media (hover:hover) and (pointer:fine){.mcard:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}}
.tab{transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.tab[aria-current="page"]{box-shadow:0 2px 8px var(--glow)}
select,.ctl button,button.b{transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),filter var(--dur) var(--ease)}
@media (hover:hover) and (pointer:fine){.ctl button:hover,select:hover,button.b:hover{border-color:var(--accent)}}
.ctl button:active,button.b:active,.nav:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){button.b.p:hover{filter:brightness(1.08)}}
button:disabled,.b:disabled{opacity:.5;cursor:not-allowed}
.ctl button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
input[type=text]:focus-visible,input[type=number]:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Tablero de tarjetas */
.g2,.g3,.secs{display:contents}
.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--sp-4)}
.board .kpis,.board .mgrid{margin:0}
.board .card{margin:0}
.bcard{grid-column:span var(--w,12);min-width:0;position:relative}
.bcard.bare{background:none;border:none;box-shadow:none;overflow:visible}
.bcard[data-h]{height:var(--bh);align-self:start;display:flex;flex-direction:column;overflow:hidden}
.bcard[data-h]>.tb,.bcard[data-h]>.cb{flex:1 1 auto;min-height:0;overflow:auto}
.bcard[data-h]>.cb:has(.cw){display:flex;flex-direction:column}
.bcard[data-h] .cw{flex:1 1 auto;height:auto;min-height:90px}
.bcard.bare[data-h]{overflow:auto}
@media (max-width:1000px){.bcard.w-s{grid-column:span 6}}
@media (max-width:680px){.board{gap:var(--sp-3)}.bcard,.bcard.w-s{grid-column:1/-1}}

/* Modo personalizar */
.ebar{display:flex;gap:var(--sp-4);justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-4)}
.ebar .ms{color:var(--ink);opacity:.8}
body.edit .bcard{outline:1.5px dashed var(--accent);outline-offset:3px;border-radius:var(--r-lg)}
body.edit .cb h2.ttl{padding-right:76px}
.ctb{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:3}
.ctb button{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh-1);cursor:pointer;font-size:15px;line-height:1;padding:0}
@media (hover:hover) and (pointer:fine){.ctb button:hover{border-color:var(--accent);box-shadow:var(--sh-2)}}
.ctb .gh{cursor:grab;touch-action:none}
.rz{position:absolute;right:0;bottom:0;width:28px;height:28px;cursor:nwse-resize;touch-action:none;z-index:3;
  background:linear-gradient(135deg,transparent 52%,var(--accent) 52%,var(--accent) 60%,transparent 60%,transparent 72%,var(--accent) 72%,var(--accent) 80%,transparent 80%)}
.bcard.dragging{opacity:.65;box-shadow:var(--sh-3);outline:2px solid var(--accent);user-select:none;z-index:5}
.cpanel{position:fixed;z-index:30;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-3);padding:var(--sp-3);display:grid;gap:var(--sp-3)}
.cpanel label{display:grid;gap:var(--sp-1);font-size:12px;color:var(--muted)}
.cpanel select,.cpanel input{width:100%;height:34px;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:0 var(--sp-2);font-size:13px;color:var(--ink)}
.cph{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-display)}
.cph button{border:none;background:none;cursor:pointer;font-size:18px;width:28px;height:28px;border-radius:var(--r-sm)}
.cpb{display:flex;gap:var(--sp-2)}
.cpb .b{flex:1}

.eh{height:26px!important;font-size:11px!important;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)!important;padding:0 6px!important}
.tb textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:var(--sp-2);font:inherit;color:var(--ink);resize:vertical;margin-top:var(--sp-2)}
.pr .l .pill{flex:none}

/* ===== Corrección de huecos, hero y registro ===== */
[hidden]{display:none!important}
:root{--hero-a:#0D2B24;--hero-b:#15614F;--hero-ink:#F2FBF8}
.bcard.card{display:flex;flex-direction:column}
.bcard .tot{margin-top:auto}
main{padding-bottom:112px}
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:var(--r-lg);padding:var(--sp-5);margin-bottom:var(--sp-4);box-shadow:var(--sh-2);display:grid;gap:var(--sp-3)}
.hero h1{color:inherit;font-size:36px}
.hero-top{display:flex;justify-content:space-between;gap:var(--sp-3);align-items:flex-start}
.hero-k{font:500 12px var(--font-num);opacity:.75;letter-spacing:.1em}
.hero-l{font-size:13px;opacity:.8}
.hero-v{font:500 42px/1.1 var(--font-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero .nav{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:inherit}
.hero .pill{background:rgba(255,255,255,.18);color:inherit}
.hbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.18);gap:2px}
.hbar span{display:block;height:100%;min-width:0}

  --bad:#FCA5A5; --bad-bg:#3F1D1D; --ok:#6EE7B7; --ok-bg:#0F3B30; --warn:#FCD34D; --warn-bg:#3A2F10;

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const ABR=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const SLUG=MES.map(m=>m.toLowerCase());
const YEARS=['2025','2026','2027'];
const KEY='mis-finanzas-prototipo-v1';
const fmt=v=>'S/ '+Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const num2=v=>Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=v=>(v*100).toFixed(1)+'%';
const sum=a=>a.reduce((x,r)=>x+(+r.m||0),0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const row=(c,m,f,k,src,card)=>{const o={c:c||'',m:m||0,f:f||'',k:k||''};if(src&&src!=='none')o.src=src;if(card)o.card=card;return o;};
function LIQ(){return [row('Yape'),row('Plin'),row('Efectivo billetes'),row('Efectivo monedas')];}
const blank=()=>({liq:LIQ(),ing:[row()],fij:[row()],hor:[row()],bbva:[row()],bcp:[row()],oh:[row()],aho:[row()],inv:[row()],eur:[{a:0,b:0,d:0,s:0,p:0}],p:[50,30,20],q:[50,30,20],nota:'',tot:false});
const normCat=k=>k||'';
const CFG0=()=>({alerta:500,meta:20,meses:3,pmode:'c',pv:2,tc:{'€':4.1,'$':3.4},eurCols:['Anterior','Actual','Debe','Saldo'],rec:[],fondoMes:'',tcDate:'',credito:{bbva:0,bcp:0,oh:0},metas:[],cats:['Necesidad','Deseo','Alquiler','Servicios','Menú','Transporte','Estudios','Salud','Ocio']});
function build(){return {'2025':Array.from({length:12},blank),'2026':Array.from({length:12},blank),'2027':Array.from({length:12},blank)};}
let S=build(),cfg=CFG0();
try{const raw=localStorage.getItem(KEY);if(raw){const j=JSON.parse(raw);if(j&&j.v===1&&j.S&&j.cfg){S=j.S;cfg=Object.assign(CFG0(),j.cfg);if(cfg.pv!==2){cfg.pmode='c';cfg.pv=2;}}}}catch(e){}
{const B0=build();YEARS.forEach(y=>{if(!S[y])S[y]=B0[y];});['Deseo','Necesidad'].forEach(c=>{if(cfg.cats.indexOf(c)<0)cfg.cats.unshift(c);});}
const localSave=()=>{try{localStorage.setItem(KEY,JSON.stringify({v:1,S,cfg}));}catch(e){}};
const save=()=>{localSave();queueSync();};

const now=new Date();
let year=String(now.getFullYear());if(YEARS.indexOf(year)<0)year='2026';
let view='resumen';
function parseHash(){const h=location.hash.slice(1);if(h==='capturar'){view='capturar';return;}const i=SLUG.indexOf(h);view=i>=0?i:'resumen';}
parseHash();

const curOf=id=>((LAY.mes&&LAY.mes.c&&LAY.mes.c[id])||{}).cur||'S/';
const rateC=(c,m)=>c==='S/'?1:((m&&m.tc&&+m.tc[c])||(+((cfg.tc||{})[c]))||1);
const rate=(id,m)=>rateC(curOf(id),m);
const CURS=['S/','$','€'];
const rowCur=(k,r)=>(r&&r.cur)||curOf(k);
/* Total de una sección en soles, respetando la moneda de cada fila */
const solesOf=(m,k)=>(m&&m[k]||[]).reduce((a,r)=>a+(+r.m||0)*rateC(rowCur(k,r),m),0);
/* Total en la moneda de la sección */
const sumIn=(m,k)=>{const rc=rate(k,m);return (m&&m[k]||[]).reduce((a,r)=>a+(+r.m||0)*rateC(rowCur(k,r),m)/rc,0);};
const mixedCur=(m,k)=>(m[k]||[]).some(r=>r.cur&&r.cur!==curOf(k)&&+r.m);
/* ---------- Ahorros: movimientos por cuenta (depósito +, retiro −) ---------- */
const ahoKind=r=>{const x=(r&&r.t)||'';return x==='aj'?'aj':x.indexOf('tr')===0?'tr':((+(r&&r.m)||0)<0?'ret':'dep');};
const ahoName=r=>((r&&r.c)||'').trim()||'Sin nombre';
function ahoPos(m){for(const y of Object.keys(S)){const i=S[y].indexOf(m);if(i>=0)return [y,i];}return null;}
/* Cuentas con su saldo (en soles) al cierre del mes (y,i): suma de todos sus movimientos hasta ahí */
function ahoAccts(y,i){
  const acc=new Map();
  for(const yy of Object.keys(S).sort()){
    if(yy>y)break;
    for(let ii=0;ii<12;ii++){
      if(yy===y&&ii>i)break;
      const m=S[yy][ii];
      (m.aho||[]).forEach(r=>{if(!(r.c||'').trim()&&!+r.m)return;const n=ahoName(r),k=n.toLowerCase(),a=acc.get(k)||{c:n,v:0};a.v+=(+r.m||0)*rateC(rowCur('aho',r),m);acc.set(k,a);});
    }
  }
  return [...acc.values()].map(a=>({c:a.c,v:Math.round(a.v*100)/100}));
}
const ahoOf=(y,i,name)=>ahoAccts(y,i).find(a=>a.c.toLowerCase()===String(name).toLowerCase());
const ahoBal=(y,i)=>(S[y]&&S[y][i])?Math.round(ahoAccts(y,i).reduce((a,x)=>a+x.v,0)*100)/100:null;
/* Lo que depositaste menos lo que retiraste en el mes (ajustes y traspasos no cuentan) */
const ahoFlow=m=>Math.round(((m&&m.aho)||[]).reduce((a,r)=>{const k=ahoKind(r);return(k==='dep'||k==='ret')?a+(+r.m||0)*rateC(rowCur('aho',r),m):a;},0)*100)/100;
const lastIdx=y=>y===String(now.getFullYear())?now.getMonth():11;
const ahoNow=y=>ahoBal(y,lastIdx(y))||0;
/* Tasa anual de cada cuenta (TREA o TEA) y ganancia estimada: interés compuesto, año de 360 días como los bancos de Perú */
const tasaOf=n=>((cfg.ahoTasa||{})[String(n).trim().toLowerCase()])||null;
const ahoGana=(bal,tz,dias)=>(tz&&+tz.v>0&&bal>0)?bal*(Math.pow(1+tz.v/100,dias/360)-1):0;
/* Convierte los ahorros guardados con el modelo anterior (saldo o aporte por año) a movimientos.
   Conserva el saldo de cada mes y el ahorro de cada mes. Corre una sola vez (cfg.ahoV). */
function migrateAho(){
  if(cfg.ahoV===3)return;
  const mode=y=>((cfg.ahoModo||{})[y])||'saldo',ys=Object.keys(S).sort(),def=curOf('aho');
  let prev=new Map(),known=false;
  ys.forEach((y,yi)=>{
    if(!Array.isArray(S[y]))return;
    const py=ys[yi-1],ini=(cfg.ahoIni||{})[y],hasIni=ini!==undefined&&ini!==''&&!isNaN(+ini),extra=[];
    if(hasIni){
      prev.forEach(a=>{if(Math.abs(a.v)>=.005){const r=row(a.c,-Math.round(a.v*100)/100,'',a.k);r.t='aj';extra.push(r);}});
      const r0=row('Saldo inicial',+ini,'','');r0.t='aj';extra.push(r0);
      prev=new Map([['saldo inicial',{c:'Saldo inicial',v:+ini,k:'',f:''}]]);known=true;
    }else if(yi===0){known=mode(y)==='aporte';}
    else if(!(mode(y)==='aporte'||mode(py)==='saldo'))known=false;
    S[y].forEach((m,i)=>{
      const rows=(m.aho||[]).filter(r=>(r.c||'').trim()||+r.m),has=rows.some(r=>+r.m)||!!m.az;
      const sol=r=>(+r.m||0)*rateC(rowCur('aho',r),m);
      let out=i===0?extra.slice():[];
      if(mode(y)==='aporte'){
        rows.forEach(r=>{const n=ahoName(r),k=n.toLowerCase(),a=prev.get(k)||{c:n,v:0,k:'',f:''};a.v+=sol(r);if(r.k)a.k=r.k;prev.set(k,a);});
        out=out.concat(rows);known=true;
      }else if(has){
        const now=new Map();
        rows.forEach(r=>{const n=ahoName(r),k=n.toLowerCase(),a=now.get(k)||{c:n,v:0,k:'',f:''};a.v+=sol(r);if(r.k)a.k=r.k;if(r.f)a.f=r.f;now.set(k,a);});
        new Set([...prev.keys(),...now.keys()]).forEach(k=>{
          const p=prev.get(k),n=now.get(k),d=Math.round(((n?n.v:0)-(p?p.v:0))*100)/100;
          if(Math.abs(d)<.005)return;
          const r=row((n||p).c,d,(n&&n.f)||'',(n&&n.k)||(p&&p.k)||'');
          if(!known)r.t='aj';
          if(def!=='S/')r.cur='S/';
          out.push(r);
        });
        prev=now;known=true;
      }
      m.aho=out.length?out:[row()];delete m.az;
    });
  });
  cfg.ahoV=3;
}
const fmtC=(id,v)=>curOf(id)+' '+num2(v);
function needWant(m){
  let n=0,w=0;
  [['fij','n'],['hor','w']].forEach(x=>{(m[x[0]]||[]).forEach(r=>{
    const v=(+r.m||0)*rateC(rowCur(x[0],r),m),k=(r.k||'').toLowerCase(),t=k.indexOf('necesid')===0?'n':k.indexOf('deseo')===0?'w':x[1];
    if(t==='n')n+=v;else w+=v;});});
  return{need:n,want:w};
}
function dv(m){const f=(k)=>solesOf(m,k);
  const ing=f('ing'),fij=f('fij'),hor=f('hor'),aho=ahoFlow(m),inv=f('inv'),gas=fij+hor,p=ahoPos(m),sAho=p?(ahoBal(p[0],p[1])||0):0,hasA=(m.aho||[]).some(r=>+r.m);
  return{...needWant(m),ing,fij,hor,gas,aho,sAho,inv,res:ing-gas-aho-inv,bb:cardDebt(m,'bbva'),bc:cardDebt(m,'bcp'),oh:cardDebt(m,'oh'),on:(ing>0||gas>0||hasA||inv>0)};}

const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CH=[];
const killCharts=()=>{CH.splice(0).forEach(c=>c.destroy());};
function mkChart(id,conf){const el=document.getElementById(id);if(!el||!window.Chart)return;CH.push(new Chart(el,conf));}
const base=anim=>({responsive:true,maintainAspectRatio:false,animation:(anim&&!reduce)?{duration:450}:false});
const axes=yf=>({x:{ticks:{color:cv('--muted'),font:{size:11},autoSkip:false},grid:{display:false},border:{color:cv('--line')}},y:{beginAtZero:true,ticks:{color:cv('--muted'),font:{size:11},callback:yf||(v=>v>=1000?(v/1000)+'k':v)},grid:{color:cv('--line')},border:{display:false}}});
const tipMoney={callbacks:{label:c=>' '+c.dataset.label+': '+fmt(c.parsed.y)}};
const goMonth=(e,els)=>{if(els&&els.length)location.hash='#'+SLUG[els[0].index];};

function header(){
  return `<div class="wrap hrow"><div class="brand"><span class="logo" aria-hidden="true">S/</span><span class="bt">Plantilla de Finanzas</span></div>
  <div class="ctl"><a class="caplink" href="#capturar">Registrar</a><label class="sr" for="yr">Año</label><select id="yr">${YEARS.map(y=>`<option${y===year?' selected':''}>${y}</option>`).join('')}</select><button id="syn" class="syn" type="button" hidden></button><button id="ed" type="button" aria-pressed="${edit}">Personalizar</button><button id="th" type="button">Tema</button></div></div>
  <nav class="wrap tabs" aria-label="Meses"><a class="tab" href="#resumen"${view==='resumen'?' aria-current="page"':''}>Resumen ${year}</a>${MES.map((m,i)=>`<a class="tab${dv(S[year][i]).on?'':' off'}" href="#${SLUG[i]}"${view===i?' aria-current="page"':''}>${ABR[i]}</a>`).join('')}</nav>`;
}

/* ---------- Resumen del año ---------- */
function metaProg(name){let s=0;YEARS.forEach(y=>(S[y]||[]).forEach(m=>(m.aho||[]).forEach(r=>{if((r.k||'')===name&&ahoKind(r)!=='tr')s+=(+r.m||0)*rateC(rowCur('aho',r),m);})));return Math.round(s*100)/100;}
function insights(){
  const out=[],ms=S[year].map(dv),cur=(year===String(now.getFullYear()))?now.getMonth():-1;
  const wi=ms.filter(x=>x.ing>0);
  if(wi.length){const r2=wi.reduce((a,x)=>a+x.aho/x.ing,0)/wi.length;out.push('Tu tasa de ahorro promedio este año es '+pct(r2)+'.');}
  if(cur>0&&ms[cur].on){const a=ms[cur].hor,b=ms[cur-1].hor;if(b>0){const d=Math.round((a-b)/b*100);out.push('En gastos hormiga vas '+(d>=0?'+'+d:d)+'% frente a '+MES[cur-1]+'.');}}
  let bi=-1,bp=0;ms.forEach((x,i)=>{if(x.ing>0&&x.aho/x.ing>bp){bp=x.aho/x.ing;bi=i;}});
  if(bi>=0)out.push('Tu mejor mes de ahorro fue '+MES[bi]+' ('+pct(bp)+').');
  if(cur>=0){const m=S[year][cur],cat={};['fij','hor'].forEach(sec=>(m[sec]||[]).forEach(r=>{if(+r.m&&(r.k||'').trim())cat[r.k]=(cat[r.k]||0)+(+r.m);}));const top=Object.keys(cat).sort((x,y)=>cat[y]-cat[x])[0];if(top)out.push('Tu categoría con más gasto este mes: '+esc(top)+' ('+fmt(cat[top])+').');}
  const r7=recentCount(7);if(r7)out.push('Registraste '+r7+(r7===1?' movimiento':' movimientos')+' en los últimos 7 días.');
  return out.slice(0,4);
}
function recentCount(days){
  const today=new Date();today.setHours(23,59,59,999);
  const cut=new Date();cut.setHours(0,0,0,0);cut.setDate(cut.getDate()-days+1);
  let n=0;
  YEARS.forEach(y=>S[y].forEach((m,mi)=>['ing','fij','hor','aho','inv','bbva','bcp','oh'].forEach(sec=>(m[sec]||[]).forEach(r=>{
    if(!(+r.m))return;const dd=parseInt(r.f)||0;if(!dd)return;const dt=new Date(+y,mi,dd);if(dt>=cut&&dt<=today)n++;}))));
  return n;
}
function viewResumen(){
  const ms=S[year],D=ms.map(dv),any=D.some(x=>x.on),nOn=D.filter(x=>x.on).length;
  const gas=D.reduce((a,x)=>a+x.gas,0),aho=D.reduce((a,x)=>a+x.aho,0),inv=D.reduce((a,x)=>a+x.inv,0);
  let bi=-1,bp=0;D.forEach((x,i)=>{if(x.ing>0&&x.aho/x.ing>bp){bp=x.aho/x.ing;bi=i;}});
  const fm=D.filter(x=>x.fij>0),avg=fm.length?fm.reduce((a,x)=>a+x.fij,0)/fm.length:0;
  const saldo=ahoNow(year),meta=cfg.meses*avg,prog=meta>0?Math.max(0,saldo)/meta:0;
  const kp=(l,v,s)=>`<div class="kpi"><div class="kl">${l}</div><div class="kv">${v}</div><div class="ks">${s}</div></div>`;
  const emp=t=>`<div class="empty">${t}</div>`;
  const nodata='Todavía no hay datos en '+year+'. Abre un mes y registra el primer movimiento.';
  const chartCard=(t,cap,id,extra,small)=>`<section class="card bcard" data-cid="${id}"><div class="cb"><h2 class="ttl">${t}</h2><div class="cap">${cap}</div>${any?`<div class="cw${small?' s':''}"><canvas id="${id}" role="img" aria-label="${t}"></canvas></div>${extra||''}`:emp(nodata)}</div></section>`;
  const lg=(arr)=>`<div class="lg">${arr.map(a=>`<span><i style="background:${a[1]}"></i>${a[0]}</span>`).join('')}</div>`;
  const today=(year===String(now.getFullYear()))?now.getMonth():-1;
  const cards=D.map((x,i)=>{
    const ing=x.ing,w=v=>ing>0?Math.max(0,Math.min(100,v/ing*100)):0;
    let st='';
    if(i===today)st='<span class="pill acc">Mes actual</span>';
    else if(x.hor>cfg.alerta)st='<span class="pill bad">Hormiga alta</span>';
    else if(x.on&&ing>0&&x.aho/ing>=cfg.meta/100)st='<span class="pill ok">Meta de ahorro</span>';
    else if(!x.on)st='<span class="pill">Sin datos</span>';
    return `<a class="mcard${x.on?'':' off'}" href="#${SLUG[i]}"><div class="mh"><b>${MES[i]}</b>${st}</div><div class="mv">${fmt(ing)}</div>
    <div class="pbar" aria-hidden="true"><span style="width:${w(x.fij)}%;background:var(--c-fij)"></span><span style="width:${w(x.hor)}%;background:var(--c-hor)"></span><span style="width:${w(x.aho)}%;background:var(--c-aho)"></span><span style="width:${w(x.inv)}%;background:var(--c-inv)"></span></div>
    <div class="ms">${ing>0?'Ahorro '+pct(x.aho/ing)+' · Gastado '+fmt(x.gas):'Sin movimientos'}</div></a>`;}).join('');
  const vacio=YEARS.every(y=>S[y].every(m=>!dv(m).on));

function drawResumen(){
  const ms=S[year],D=ms.map(dv);if(!D.some(x=>x.on))return;
  const b=base(true),t=k=>D.reduce((a,x)=>a+x[k],0);
  const col=(l,d,c,w)=>({label:l,data:d,backgroundColor:c,borderColor:c,borderRadius:4,maxBarThickness:w||10,tension:.25,pointRadius:3});
  mkChart('r1',{type:ctype('r1','bar'),data:{labels:ABR,datasets:[col('Ingreso',D.map(x=>x.ing),cv('--c-ing')),col('Gastado',D.map(x=>x.gas),cv('--c-gas')),col('Ahorrado',D.map(x=>x.aho),cv('--c-aho'))]},options:{...b,onClick:goMonth,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:tipMoney},scales:axes()}});
  const yrs=YEARS.filter(y=>S[y].some(m=>dv(m).on)),pal=[cv('--c-ing'),cv('--c-aho'),cv('--c-inv'),cv('--c-fij')];
  if(document.getElementById('r5'))mkChart('r5',{type:ctype('r5','line'),data:{labels:ABR,datasets:yrs.map((y,j)=>({label:y,data:S[y].map(m=>{const d=dv(m);return d.on?d.aho:null;}),borderColor:pal[j%4],backgroundColor:pal[j%4],borderRadius:4,maxBarThickness:10,tension:.25,pointRadius:3,borderWidth:y===year?3:1.8,spanGaps:false}))},options:{...b,interaction:{mode:'index',intersect:false},plugins:{legend:{display:true,labels:{color:cv('--muted'),boxWidth:10,font:{size:11}}},tooltip:tipMoney},scales:axes()}});
  const l2={...col('Ahorro',D.map(x=>x.ing>0?+(x.aho/x.ing*100).toFixed(1):null),cv('--c-aho'),22),pointRadius:4,spanGaps:false};
  mkChart('r2',{type:ctype('r2','line'),data:{labels:ABR,datasets:[l2,{type:'line',label:'Meta',data:ABR.map(()=>cfg.meta),borderColor:cv('--muted'),borderDash:[5,4],pointRadius:0,borderWidth:1.5}]},options:{...b,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+c.parsed.y+'%'}}},scales:axes(v=>v+'%')}});
  const t3=ctype('r3','bar'),hc=D.map(x=>x.hor>cfg.alerta?cv('--bad'):cv('--c-hor'));
  mkChart('r3',{type:'bar',data:{labels:ABR,datasets:[{type:t3,label:'Gastos hormiga',data:D.map(x=>x.hor),backgroundColor:t3==='bar'?hc:cv('--c-hor'),borderColor:cv('--c-hor'),pointBackgroundColor:hc,pointRadius:4,tension:.25,borderRadius:4,maxBarThickness:22},{type:'line',label:'Alerta',data:ABR.map(()=>cfg.alerta),borderColor:cv('--muted'),borderDash:[5,4],pointRadius:0,borderWidth:1.5}]},options:{...b,onClick:goMonth,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:tipMoney},scales:axes()}});
  const t4=ctype('r4','doughnut');
  mkChart('r4',{type:t4,data:{labels:['Gastos fijos','Gastos hormiga','Ahorros','Inversión'],datasets:[{data:[t('fij'),t('hor'),Math.max(0,t('aho')),t('inv')],backgroundColor:[cv('--c-fij'),cv('--c-hor'),cv('--c-aho'),cv('--c-inv')],borderColor:cv('--surface'),borderWidth:2}]},options:{...b,cutout:t4==='doughnut'?'64%':0,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.label+': '+fmt(c.parsed)}}}}});
  /* Cascada: a dónde fue el ingreso del año (barras flotantes) */
  if(document.getElementById('r6')){
    const steps=[['Ingreso',t('ing'),'--muted'],['Fijos',-t('fij'),'--c-fij'],['Hormiga',-t('hor'),'--c-hor'],['Inversión',-t('inv'),'--c-inv'],['Ahorro',-t('aho'),'--c-aho']];
    let run=0;const bars=[],cols=[],mags=[];
    steps.forEach(s=>{const start=run;run+=s[1];bars.push([Math.min(start,run),Math.max(start,run)]);cols.push(cv(s[2]));mags.push(s[1]);});
    bars.push([Math.min(0,run),Math.max(0,run)]);cols.push(cv('--accent'));mags.push(run);
    mkChart('r6',{type:'bar',data:{labels:['Ingreso','Fijos','Hormiga','Inversión','Ahorro','Queda'],datasets:[{data:bars,backgroundColor:cols,borderColor:cols,borderRadius:4,maxBarThickness:46}]},options:{...b,plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>c[0].label,label:c=>{const m=mags[c.dataIndex];return ' '+(m<0?'−':'')+fmt(Math.abs(m));}}}},scales:axes()}});
  }
  /* Capital acumulado: ahorro + inversión acumulados mes a mes */
  if(document.getElementById('r7')){
    let acc=0,started=false;const cap=D.map(x=>{if(x.on)started=true;if(!started)return null;acc+=x.inv;return Math.round((x.sAho+acc)*100)/100;});
    mkChart('r7',{type:ctype('r7','line'),data:{labels:ABR,datasets:[{label:'Capital acumulado',data:cap,borderColor:cv('--c-aho'),backgroundColor:cv('--c-aho'),borderWidth:2.5,tension:.25,pointRadius:3,maxBarThickness:22,borderRadius:4,spanGaps:true,fill:false}]},options:{...b,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:tipMoney},scales:axes()}});
  }
}

const inp=(s,i,k,v,t,ph)=>`<input id="${s}-${i}-${k}" data-s="${s}" data-i="${i}" data-k="${k}" type="${t}" ${t==='number'?'step="0.01" inputmode="decimal" value="'+(v?v:'')+'"':'value="'+esc(v)+'"'} placeholder="${ph}" aria-label="${ph==='0.00'?'Monto':ph}">`;

const del=(s,i)=>`<button type="button" class="x" data-del="${s}" data-i="${i}" aria-label="Quitar fila">×</button>`;
const TPL={ing:'1fr 58px 90px 44px',gas:'1fr 88px 112px 58px 44px',aho:'1fr 90px 58px 44px',bnk:'1fr 100px 44px'};
const EDITABLE=['ing','fij','hor','aho','inv'];
const act=(s,i)=>`<div class="rwx">${EDITABLE.indexOf(s)>=0?`<button type="button" class="x ed-row" data-edit="${s}" data-i="${i}" aria-label="Editar fila" title="Editar">✎</button>`:''}<button type="button" class="x" data-del="${s}" data-i="${i}" aria-label="Quitar fila">×</button></div>`;
const HEAD={ing:['Concepto','Fecha','Monto',''],gas:['Concepto','Monto','Categoría','Fecha',''],aho:['Cuenta','Saldo','Fecha',''],bnk:['Concepto','Monto','']};
const mInp=(s,i,r,ph)=>{const v=inp(s,i,'m',r.m,'number',ph||'0.00');return (r.cur&&r.cur!==curOf(s))?`<span class="mwrap"><b class="curb" aria-hidden="true">${r.cur}</b>${v}</span>`:v;};
function rowsHtml(m,s,t){return m[s].map((r,i)=>{
  let c='';

function tasaHtml(a){

function ahoCard(m){
  const p=ahoPos(m),y=p?p[0]:year,i=p?p[1]:0,accs=ahoAccts(y,i),ml=m.aho||[];
  const touched={};ml.forEach(r=>{if((r.c||'').trim()||+r.m)touched[ahoName(r).toLowerCase()]=1;});
  const isLeg=a=>/^total ahorrado$/i.test(a.c),list=accs.filter(a=>!isLeg(a)&&(Math.abs(a.v)>=.005||touched[a.c.toLowerCase()])),hasLeg=accs.some(a=>isLeg(a)&&Math.abs(a.v)>=.005),bal=ahoBal(y,i)||0;
  let dp=0,rt=0,aj=0;
  ml.forEach(r=>{const v=(+r.m||0)*rateC(rowCur('aho',r),m),k=ahoKind(r);if(k==='dep')dp+=v;else if(k==='ret')rt-=v;else if(k==='aj')aj+=v;});
  const parts=[];if(dp)parts.push('depositaste '+fmt(dp));if(rt)parts.push('retiraste '+fmt(rt));if(Math.abs(aj)>=.005)parts.push('ajustaste '+(aj>0?'+':'−')+fmt(Math.abs(aj)));
  let gm=0,ga=0,conT=0;list.forEach(a=>{const tz=tasaOf(a.c);if(tz&&a.v>0){conT++;gm+=ahoGana(a.v,tz,30);ga+=ahoGana(a.v,tz,360);}});

/* ---------- Registro rápido ---------- */
const RULES=[['ing',/sueldo|ingreso|dep[oó]sito|pago recibido/],['aho',/ahorro|ahorr[eé]/],['inv',/inversi[oó]n|xtb|crypto|cripto/],['fij',/alquiler|luz|agua|internet|pensi[oó]n|universidad|usil|celular|servicio/],['hor',/.*/]];
const NAMES={ing:'Ingresos',aho:'Ahorros',inv:'Inversiones',fij:'Gastos fijos',hor:'Gastos hormiga'};
const todayStr=()=>now.getDate()+'-'+ABR[now.getMonth()].toLowerCase();
function parseMsg(text){
  const t=text.toLowerCase(),mt=t.match(/\d+(?:[.,]\d{1,2})?/);if(!mt)return null;
  const amt=parseFloat(mt[0].replace(',','.'));
  const desc=t.replace(mt[0],'').replace(/\b(yape|plin|efectivo|tarjeta)\b/g,'').replace(/\s+/g,' ').trim();
  return{amt,sec:RULES.find(r=>r[1].test(t))[0],name:desc?desc.charAt(0).toUpperCase()+desc.slice(1):''};
}
function addRow(yr,mi,sec,r){
  const arr=S[yr][mi][sec],k=arr.findIndex(x=>!x.c&&!x.m);
  if(k>=0){arr[k]=r;return{yr,mi,sec,r,rep:true};}
  arr.push(r);return{yr,mi,sec,r,rep:false};
}
function undoRow(u){
  if(u&&u.fn){u.fn();save();render();return;}
  const m=S[u.yr][u.mi],arr=m[u.sec],k=arr.indexOf(u.r);if(k<0)return;
  if(u.r.src)revDed(m,u.r);
  if(u.rep)arr[k]=row();else arr.splice(k,1);
  if(!arr.length)arr.push(row());
  save();render();
}
function quickAdd(text){
  const p=parseMsg(text);if(!p)return{err:'Falta el monto. Prueba con: almuerzo 25 yape'};
  if(p.sec==='aho'){
    if(typeof view!=='number')return{err:'Abre un mes para registrar tu ahorro.'};
    const low=text.toLowerCase(),accs=ahoAccts(year,view);
    let a=accs.find(x=>low.indexOf(x.c.toLowerCase())>=0);
    if(!a){let ls='';try{ls=localStorage.getItem(KEY+'-ahoacct')||'';}catch(e){}a=accs.find(x=>x.c===ls)||accs[0];}
    const nm=a?a.c:'Ahorros';try{localStorage.setItem(KEY+'-ahoacct',nm);}catch(e){}
    const r0=ahoDo({yr:year,mo:view,ax:'dep',from:'aho:'+nm,amt:p.amt,desc:'',fch:todayStr(),goal:'',src:'',cur:''});
    return{ok:r0.msg,u:r0.u};
  }
  const nm=p.name||'Sin descripción',u=addRow(year,view,p.sec,row(nm,p.amt,todayStr()));
  return{ok:nm+' · '+fmt(p.amt)+' en '+NAMES[p.sec],u};

async function pushNow(force){

  sync.busy=true;sync.state='saving';updateChip();

    const rev=sync.rev||0;const rows=toRows();

    const stamp='v'+Date.now();

  }catch(e){sync.state='error';sync.msg=errMsg(e);}

}

/* ---------- Tipo de cambio: SUNAT guardado por mes ---------- */
const FX_SRC=[
  {n:'ExchangeRate-API',url:'https://open.er-api.com/v6/latest/USD',pen:j=>j&&j.result==='success'&&j.rates?+j.rates.PEN:0,eur:j=>j&&j.rates&&+j.rates.EUR?+j.rates.PEN/+j.rates.EUR:0},
  {n:'currency-api',url:'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',pen:j=>j&&j.usd?+j.usd.pen:0,eur:j=>j&&j.usd&&+j.usd.eur?+j.usd.pen/+j.usd.eur:0}
];
const fxToday=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fxRound=v=>Math.round(v*1000)/1000;
const tc3=v=>{const n=+v;return n?String(Math.round(n*1000)/1000):'';};
const fmtISO=f=>/^\d{4}-\d{2}-\d{2}$/.test(String(f||''))?f.slice(8)+'/'+f.slice(5,7)+'/'+f.slice(0,4):'';
/* Mercado (referencial): dólar y euro. Se usa para el euro y como plan B del dólar. */
async function fxFetch(){
  let last=null;
  for(const s of FX_SRC){
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
    try{
      const r=await fetch(s.url,{signal:ctl.signal,cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json(),pen=s.pen(j),eur=s.eur(j);
      if(pen>1&&pen<20&&eur>1&&eur<30)return{usd:pen,eur:eur,src:s.n};
      throw new Error('datos fuera de rango');
    }catch(e){last=e;}finally{clearTimeout(to);}
  }
  throw last||new Error('sin conexión');
}
/* SUNAT (oficial, dólar): llega por una función de tu Supabase que lee el archivo público de SUNAT. */
async function fxSunat(){
  if(!SB_URL)return null;
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
  try{
    const r=await fetch(SB_URL+'/functions/v1/tipo-cambio',{headers:{apikey:SB_KEY},signal:ctl.signal,cache:'no-store'});
    if(!r.ok)return null;
    const j=await r.json();
    if(j&&+j.venta>1&&+j.venta<20&&/^\d{4}-\d{2}-\d{2}$/.test(String(j.fecha)))return{usd:+j.venta,compra:+j.compra||0,fecha:j.fecha};
    return null;
  }catch(e){return null;}finally{clearTimeout(to);}
}
function tcmInfo(m){
  const t=m.tc;
  if(!t||!(+t['$']||+t['€']))return 'Sin tasa propia: este mes usa la de respaldo (1 $ = S/ '+(tc3((cfg.tc||{})['$'])||'—')+' · 1 € = S/ '+(tc3((cfg.tc||{})['€'])||'—')+').';
  const s=t.s==='SUNAT'?'SUNAT (venta)':t.s==='Mercado'?'Mercado, no SUNAT':t.s==='Manual'?'Manual':'';
  return 'Tasa propia de este mes'+(s?' · '+s:'')+(t.f?' · '+fmtISO(t.f):'')+'.';
}
function tcmCard(m,i){
  const t=m.tc||{},cur=(year===String(now.getFullYear())&&i===now.getMonth()),fb=cfg.tc||{};
  return `<section class="card bcard tcm" data-cid="tcm"><div class="cb"><h2 class="ttl">Tipo de cambio del mes</h2>
    <div class="tcm-row"><label for="tcm-d">1 $ en S/<input id="tcm-d" type="number" step="0.001" inputmode="decimal" data-tcm="$" value="${tc3(t['$'])}" placeholder="${tc3(fb['$'])}"></label><label for="tcm-e">1 € en S/<input id="tcm-e" type="number" step="0.001" inputmode="decimal" data-tcm="€" value="${tc3(t['€'])}" placeholder="${tc3(fb['€'])}"></label>${cur?'<button class="b" id="tcm-sunat" type="button">Actualizar con SUNAT</button>':''}</div>
    <div class="ms" id="tcm-st" role="status">${esc(tcmInfo(m))}</div>
    <div class="ms">${cur?'Cada día se guarda aquí la tasa SUNAT; al cambiar de mes queda congelada.':'SUNAT solo publica la tasa del día: para este mes escribe la tasa a mano.'} El euro es referencial (SUNAT no lo publica).</div></div></section>`;
}
let fxBusy=false;
async function fxUpdate(manual){
  const say=t=>['fx-msg','tcm-st'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=t;});
  const btns=()=>['fx-now','tcm-sunat'].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=fxBusy;});
  if(window.claude&&window.claude.use){if(manual)say('La actualización con SUNAT funciona en la versión web, no en esta vista previa.');return;}
  if(fxBusy)return;fxBusy=true;btns();
  if(manual)say('Consultando SUNAT…');
  try{
    const sun=await fxSunat(),mkt=await fxFetch().catch(()=>null);
    if(!sun&&!mkt)throw new Error('sin datos');
    const usd=sun?sun.usd:mkt.usd,fecha=sun?sun.fecha:fxToday();
    const eur=mkt?usd*(mkt.eur/mkt.usd):0;
    const d=new Date(),y=String(d.getFullYear()),m=S[y]&&S[y][d.getMonth()];
    if(m){
      const lockManual=!manual&&m.tc&&m.tc.s==='Manual',downgrade=!manual&&!sun&&m.tc&&m.tc.s==='SUNAT';
      if(!lockManual&&!downgrade){
        const prev=m.tc||{},n={'$':fxRound(usd),f:fecha,s:sun?'SUNAT':'Mercado'};
        if(sun&&sun.compra)n.c=sun.compra;
        const e2=eur?fxRound(eur):(+prev['€']||0);if(e2)n['€']=e2;
        m.tc=n;
      }
    }
    if(sun)cfg.tcAt=fxToday();
    cfg.tcLast={f:fecha,s:sun?'SUNAT':'Mercado',usd:fxRound(usd),eur:eur?fxRound(eur):0};
    save();render();
    if(manual||sun)toast((sun?'SUNAT':'Mercado (SUNAT no respondió)')+': 1 $ = S/ '+tc3(usd)+(eur?' · 1 € = S/ '+tc3(eur):''));
  }catch(e){
    if(manual)say('No pude consultar el tipo de cambio ahora. Se mantiene el que tenías.');
  }finally{fxBusy=false;btns();}
}
function fxAuto(){
  if(window.claude&&window.claude.use)return;
  if(cfg.tcAuto===false||cfg.tcAt===fxToday())return;
  fxUpdate(false);
}

/* ---------- Mejoras: recurrentes, mes anterior, cuadre, respaldo, meta ---------- */
const MESN=v=>MES[+v.slice(5,7)-1]+' '+v.slice(0,4);
function fondoPlan(meta,aho){
  const f=cfg.fondoMes;if(!f||!/^\d{4}-\d{2}$/.test(f))return 'Elige una fecha y te digo cuánto ahorrar por mes.';
  const left=(+f.slice(0,4)-now.getFullYear())*12+(+f.slice(5,7)-1-now.getMonth());
  const miss=Math.max(0,meta-aho);
  if(miss<=0)return '¡Ya llegaste a la meta del fondo!';
  if(left<=0)return 'La fecha elegida ya pasó. Elige una fecha futura. Te faltan '+fmt(miss)+'.';
  return 'Te faltan '+fmt(miss)+'. Para llegar en '+MESN(f)+' necesitas ahorrar '+fmt(miss/left)+' por mes ('+left+(left===1?' mes':' meses')+').';
}
const emptyArr=a=>!a.some(r=>(r.c||'').trim()||+r.m);

/* ---------- Movimientos de ahorro: depositar, retirar, ajustar y mover ---------- */
function moveAccts(y,i,to){
  const m=S[y][i],out=[];
  (m.liq||[]).forEach((r,j)=>{if((r.c||'').trim())out.push(['liq:'+j,r.c.trim()+' · '+curOf('liq')+' '+num2(+r.m||0),'--h-liq']);});
  ahoAccts(y,i).forEach(a=>{if(Math.abs(a.v)>=.005)out.push(['aho:'+a.c,a.c+' · '+fmt(a.v),'--c-aho']);});
  if(to)out.push(['aho:+','+ Nueva cuenta de ahorro','--c-aho']);

function ahoPreview(){
  const m=S[ent.yr][+ent.mo],el=document.getElementById('sa'),amt=parseFloat(String(el?el.value:'').replace(',','.'))||0,ax=ent.ax||'dep';
  if(ax==='mov')return 'No es gasto ni ingreso: solo cambia dónde está tu dinero';
  const id=ent.from||'';

  const nm=(id.slice(0,4)==='aho:'&&id!=='aho:+')?id.slice(4):'',a=nm?ahoOf(ent.yr,+ent.mo,nm):null,cur0=a?a.v:0,lbl=nm||'Cuenta nueva',sol=amt*rateC(entCur(),m);
  if(ax==='aj'){const d=sol-cur0;return lbl+': '+fmt(cur0)+' → '+fmt(sol)+(Math.abs(d)>=.005?' (ajuste '+(d>0?'+':'−')+fmt(Math.abs(d))+')':'')+' · No cambia lo que te queda';}
  if(!amt)return lbl+': saldo '+fmt(cur0);

function doAho(o){
  const m=S[o.yr][o.mo],cur=o.cur||curOf('aho'),def=curOf('aho');
  const nameOf=id=>id==='aho:+'?((o.desc||'').trim()||'Nueva cuenta'):id.slice(4);
  const mk=(n,v)=>{const r=row(n,Math.round(v*100)/100,o.fch,'');if(cur!==def)r.cur=cur;return r;};
  const add=r=>addRow(o.yr,o.mo,'aho',r),bal=n=>(ahoOf(o.yr,o.mo,n)||{v:0}).v;
  if(o.ax==='dep'||o.ax==='ret'){
    const sg=o.ax==='dep'?1:-1,nm=nameOf(o.from),r=mk(nm,sg*o.amt);
    if(sg>0&&o.goal)r.k=o.goal;
    if(o.src&&o.src!=='none')r.src=o.src;
    add(r);const dd=r.src?applyDed(m,r,'aho'):'';
    return (sg>0?'Depositaste ':'Retiraste ')+cur+' '+num2(o.amt)+(sg>0?' en ':' de ')+nm+dd+' · saldo '+fmt(bal(nm));
  }
  if(o.ax==='aj'){
    const nm=nameOf(o.from),b0=bal(nm),target=o.amt*rateC(cur,m),d=Math.round((target-b0)*100)/100;
    if(Math.abs(d)<.005)return nm+' ya tenía ese saldo: '+fmt(b0);
    const r=mk(nm,d/rateC(cur,m));r.t='aj';add(r);
    return 'Saldo de '+nm+' ajustado: '+fmt(b0)+' → '+fmt(target)+' (no cuenta como ahorro del mes)';
  }
  const fa=o.from.slice(0,4)==='aho:',ta=o.to.slice(0,4)==='aho:';
  const fn=fa?nameOf(o.from):((m.liq[+o.from.slice(4)]||{}).c||'Liquidez'),tn=ta?nameOf(o.to):((m.liq[+o.to.slice(4)]||{}).c||'Liquidez');
  if(fa&&ta){const id='tr:'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),a=mk(fn,-o.amt),b=mk(tn,o.amt);a.t=b.t=id;add(a);add(b);}
  else if(fa){const r=mk(fn,-o.amt);r.src=o.to;add(r);applyDed(m,r,'aho');}
  else if(ta){const r=mk(tn,o.amt);r.src=o.from;if(o.goal)r.k=o.goal;add(r);applyDed(m,r,'aho');}
  else{
    const sol=o.amt*rateC(cur,m),L1=m.liq[+o.from.slice(4)],L2=m.liq[+o.to.slice(4)];
    if(L1)L1.m=Math.round(((+L1.m||0)-sol/rate('liq',m))*100)/100;
    if(L2)L2.m=Math.round(((+L2.m||0)+sol/rate('liq',m))*100)/100;
  }
  return 'Moviste '+cur+' '+num2(o.amt)+' de '+fn+' a '+tn;
}
