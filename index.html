/* Layout: barra fija con año, tema y pestañas por mes; debajo, resumen anual o el detalle de un mes con los mismos apartados de la hoja */
:root{

  --accent:#0B7A62; --on-accent:#FFFFFF; --accent-soft:#D3EBE4;

  --bad:#B3261E; --bad-bg:#F8DAD7; --ok:#1C6B3C; --ok-bg:#D6EEDF; --warn:#7A5410; --warn-bg:#F7E9C6;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#3CC9A6; --on-accent:#06251D; --accent-soft:#1B3A31;
  --c-ing:#5B93F0; --c-gas:#F28A57; --c-aho:#3CC596; --c-inv:#9A82F0; --c-res:#6E7C75; --c-fij:#6B96F0; --c-hor:#F28A57;
  --bad:#F2A29C; --bad-bg:#3F1E1C; --ok:#8FDDAE; --ok-bg:#1B3A28; --warn:#E9CF86; --warn-bg:#3A3014;
  --h-ing:#3FB8A3; --h-pre:#D9BC3A; --h-fij:#E27A91; --h-hor:#A394E0; --h-bbva:#3345C9; --h-bcp:#4A6BFF; --h-oh:#8A8A8A; --h-aho:#EE9F78; --h-inv:#4FB562; --h-eur:#7FA3CC;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#17211D; --surface-2:#1E2A25; --ink:#E7EEEA; --muted:#98A8A0; --line:#2C3B35;
  --accent:#3CC9A6; --on-accent:#06251D; --accent-soft:#1B3A31;
  --c-ing:#5B93F0; --c-gas:#F28A57; --c-aho:#3CC596; --c-inv:#9A82F0; --c-res:#6E7C75; --c-fij:#6B96F0; --c-hor:#F28A57;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
.wrap{max-width:1560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}

.bt{font:600 18px var(--font-display);letter-spacing:-.01em}
.ctl{display:flex;gap:8px;align-items:center}
select,input,button{font-family:inherit;color:var(--ink)}
select,.ctl button{height:34px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:0 10px;font-size:13px;cursor:pointer}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.tab{flex:none;padding:6px 12px;border-radius:8px;font-weight:500;font-size:13px;color:var(--muted)}
@media (hover:hover) and (pointer:fine){.tab:hover{background:var(--surface-2);color:var(--ink)}}
.tab.off{opacity:.7}
.tab[aria-current="page"]{background:var(--accent);color:var(--on-accent);opacity:1}

main{padding-block:22px 48px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font:700 30px/1.1 var(--font-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin-top:4px}
h2{font:600 15px var(--font-display);margin:0}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.nav{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.nav.dis{opacity:.35}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cb{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kl{font-size:12px;color:var(--muted)}
.kv{font:500 20px var(--font-num);font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.ks{font-size:12px;color:var(--muted);margin-top:2px}
.kv.neg{color:var(--bad)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-bottom:16px}
.cw{position:relative;height:230px}
.cw.s{height:190px}
.cap{font-size:12px;color:var(--muted);margin:2px 0 8px}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.empty{display:grid;place-items:center;min-height:150px;text-align:center;color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:10px}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px;margin-bottom:16px}
.mcard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
@media (hover:hover) and (pointer:fine){.mcard:hover{border-color:var(--accent)}}
.mcard.off{opacity:.55}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.mh b{font:600 15px var(--font-display)}
.mv{font:500 17px var(--font-num);font-variant-numeric:tabular-nums}
.pbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);margin:8px 0 6px}
.pbar span{display:block;height:100%}
.ms{font-size:12px;color:var(--muted)}

.fond{display:flex;align-items:baseline;gap:10px;margin:4px 0 10px}
.fond b{font:600 34px var(--font-display);letter-spacing:-.02em}
.meter{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter div{height:100%;background:var(--c-aho);border-radius:6px}
.hm7{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:36px;gap:4px;align-content:start}
.hmhead{text-align:center;font-size:12px;color:var(--muted);padding-bottom:2px}
.hmcell{height:36px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center}
.hmcell span{font-size:12px;color:var(--muted)}
.hmcell.on span{color:var(--fg);font-weight:600}
.hmcell.empty{border:none;background:transparent!important}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.cfg label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px 4px 2px 10px;font-size:12px}
.chip button{border:none;background:none;cursor:pointer;color:var(--muted);width:20px;height:20px;border-radius:6px}

input[type=text],input[type=number],select.f{height:32px;width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:0 8px;font-size:13px}
input[type=number]{font-family:var(--font-num);text-align:right}
button.b{height:34px;padding:0 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:13px;font-weight:500}
button.b.p{background:var(--accent);color:var(--on-accent);border-color:transparent}
@media (hover:hover) and (pointer:fine){button.b:hover{border-color:var(--accent)}}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.qa input{flex:1;min-width:200px;height:38px}
.qm{font-size:12px;color:var(--muted);min-height:18px;margin-bottom:14px}
.qm.err{color:var(--bad)}

.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
@media (min-width:900px){.span2{grid-column:span 2}}
.sh{display:flex;align-items:center;gap:8px;padding:10px 14px;font:600 14px var(--font-display);background:color-mix(in srgb,var(--h) 16%,var(--surface));border-bottom:1px solid var(--line)}
.sh i{width:10px;height:10px;border-radius:3px;background:var(--h);flex:none}
.sh.solid{background:var(--h);color:#fff}
.sh.solid i{display:none}
.tb{overflow-x:auto;padding:12px 14px 6px}
.rw{display:grid;gap:6px;align-items:center;margin-bottom:6px;min-width:330px}
.rw.lb{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.x .ic{display:block;margin:auto;pointer-events:none}.x{width:22px;height:28px;border:none;background:none;color:var(--muted);cursor:pointer;border-radius:6px;font-size:14px;padding:0}
@media (hover:hover) and (pointer:fine){.x:hover{color:var(--bad)}}
.add{margin:0 14px 12px;height:30px;font-size:12px}
.tot{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-weight:600;background:var(--surface-2)}
.tot span:last-child{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.pr{margin-bottom:12px}
.pr .l{display:flex;align-items:center;gap:8px}
.pr .l span:first-child{flex:1}
.pr input{width:60px}
.pr .bar{height:8px;border-radius:4px;background:var(--surface-2);margin:6px 0 2px;overflow:hidden}
.pr .bar div{height:100%;width:0;border-radius:4px}
.note{font-size:12px;color:var(--muted);padding:0 14px 10px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Sistema de diseño: escalas, elevación, movimiento y estados ===== */
:root{
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sh-1:0 1px 2px rgba(20,32,27,.06),0 1px 1px rgba(20,32,27,.04);
  --sh-2:0 6px 18px rgba(20,32,27,.10);
  --sh-3:0 14px 36px rgba(20,32,27,.20);
  --dur:160ms; --ease:cubic-bezier(.2,.7,.2,1);
  --glow:color-mix(in srgb,var(--accent) 22%,transparent);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sh-1:0 1px 2px rgba(0,0,0,.35);--sh-2:0 6px 18px rgba(0,0,0,.40);--sh-3:0 14px 36px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--sh-1:0 1px 2px rgba(0,0,0,.35);--sh-2:0 6px 18px rgba(0,0,0,.40);--sh-3:0 14px 36px rgba(0,0,0,.55)}

body{background:radial-gradient(1200px 420px at 85% -120px,var(--glow),transparent 70%),var(--bg)}
main{padding-block:var(--sp-5) 56px}
.card{border-radius:var(--r-lg);box-shadow:var(--sh-1);transition:box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.kpi{border-radius:var(--r-md);box-shadow:var(--sh-1);position:relative;overflow:hidden;padding-top:15px}
.kpi::before{content:"";position:absolute;left:14px;top:0;width:30px;height:4px;border-radius:0 0 4px 4px;background:var(--accent)}
#app[data-v="r"] .kpi:nth-child(1)::before{background:var(--c-gas)}
#app[data-v="r"] .kpi:nth-child(2)::before{background:var(--c-aho)}
#app[data-v="r"] .kpi:nth-child(3)::before{background:var(--c-inv)}
#app[data-v="m"] .kpi:nth-child(1)::before{background:var(--c-ing)}
#app[data-v="m"] .kpi:nth-child(2)::before{background:var(--c-gas)}
#app[data-v="m"] .kpi:nth-child(3)::before{background:var(--c-inv)}
#app[data-v="m"] .kpi:nth-child(4)::before{background:var(--c-aho)}
#app[data-v="m"] .kpi:nth-child(5)::before{background:var(--c-res)}
.mcard{border-radius:var(--r-md);box-shadow:var(--sh-1);transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
@media (hover:hover) and (pointer:fine){.mcard:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}}
.tab{transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.tab[aria-current="page"]{box-shadow:0 2px 8px var(--glow)}
select,.ctl button,button.b{transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease),filter var(--dur) var(--ease)}
@media (hover:hover) and (pointer:fine){.ctl button:hover,select:hover,button.b:hover{border-color:var(--accent)}}
.ctl button:active,button.b:active,.nav:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){button.b.p:hover{filter:brightness(1.08)}}
button:disabled,.b:disabled{opacity:.5;cursor:not-allowed}
.ctl button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
input[type=text]:focus-visible,input[type=number]:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Tablero de tarjetas */
.g2,.g3,.secs{display:contents}
.board{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--sp-4)}
.board .kpis,.board .mgrid{margin:0}
.board .card{margin:0}
.bcard{grid-column:span var(--w,12);min-width:0;position:relative}
.bcard.bare{background:none;border:none;box-shadow:none;overflow:visible}
.bcard[data-h]{height:var(--bh);align-self:start;display:flex;flex-direction:column;overflow:hidden}
.bcard[data-h]>.tb,.bcard[data-h]>.cb{flex:1 1 auto;min-height:0;overflow:auto}
.bcard[data-h]>.cb:has(.cw){display:flex;flex-direction:column}
.bcard[data-h] .cw{flex:1 1 auto;height:auto;min-height:90px}
.bcard.bare[data-h]{overflow:auto}
@media (max-width:1000px){.bcard.w-s{grid-column:span 6}}
@media (max-width:680px){.board{gap:var(--sp-3)}.bcard,.bcard.w-s{grid-column:1/-1}}

/* Modo personalizar */
.ebar{display:flex;gap:var(--sp-4);justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-4)}
.ebar .ms{color:var(--ink);opacity:.8}
body.edit .bcard{outline:1.5px dashed var(--accent);outline-offset:3px;border-radius:var(--r-lg)}
body.edit .cb h2.ttl{padding-right:76px}
.ctb{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:3}
.ctb button{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh-1);cursor:pointer;font-size:15px;line-height:1;padding:0}
@media (hover:hover) and (pointer:fine){.ctb button:hover{border-color:var(--accent);box-shadow:var(--sh-2)}}
.ctb .gh{cursor:grab;touch-action:none}
.rz{position:absolute;right:0;bottom:0;width:28px;height:28px;cursor:nwse-resize;touch-action:none;z-index:3;
  background:linear-gradient(135deg,transparent 52%,var(--accent) 52%,var(--accent) 60%,transparent 60%,transparent 72%,var(--accent) 72%,var(--accent) 80%,transparent 80%)}
.bcard.dragging{opacity:.65;box-shadow:var(--sh-3);outline:2px solid var(--accent);user-select:none;z-index:5}
.cpanel{position:fixed;z-index:30;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-3);padding:var(--sp-3);display:grid;gap:var(--sp-3)}
.cpanel label{display:grid;gap:var(--sp-1);font-size:12px;color:var(--muted)}
.cpanel select,.cpanel input{width:100%;height:34px;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:0 var(--sp-2);font-size:13px;color:var(--ink)}
.cph{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-display)}
.cph button{border:none;background:none;cursor:pointer;font-size:18px;width:28px;height:28px;border-radius:var(--r-sm)}
.cpb{display:flex;gap:var(--sp-2)}
.cpb .b{flex:1}

.eh{height:26px!important;font-size:12px!important;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)!important;padding:0 6px!important}
.tb textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:var(--sp-2);font:inherit;color:var(--ink);resize:vertical;margin-top:var(--sp-2)}
.pr .l .pill{flex:none}

/* ===== Corrección de huecos, hero y registro ===== */
[hidden]{display:none!important}
:root{--hero-a:#0D2B24;--hero-b:#15614F;--hero-ink:#F2FBF8}
.bcard.card{display:flex;flex-direction:column}
.bcard .tot{margin-top:auto}
main{padding-bottom:112px}
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:var(--r-lg);padding:var(--sp-5);margin-bottom:var(--sp-4);box-shadow:var(--sh-2);display:grid;gap:var(--sp-3)}
.hero h1{color:inherit;font-size:36px}
.hero-top{display:flex;justify-content:space-between;gap:var(--sp-3);align-items:flex-start}
.hero-k{font:500 12px var(--font-num);opacity:.75;letter-spacing:.1em}
.hero-l{font-size:13px;opacity:.8}
.hero-v{font:500 42px/1.1 var(--font-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero .nav{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:inherit}
.hero .pill{background:rgba(255,255,255,.18);color:inherit}
.hbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.18);gap:2px}
.hbar span{display:block;height:100%;min-width:0}
.hleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px}
.hleg i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.hero .qa{margin:0}
.hero .qa input{background:#fff;color:#14201B;border:none;border-radius:var(--r-sm)}
.hero .qa .b.p{background:#fff;color:#0D2B24;border:none}
.hero .qm{color:inherit;opacity:.8;margin:0}
.hero .qm.err{opacity:1;font-weight:600}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 8px));bottom:max(16px,calc(env(safe-area-inset-bottom,0px) + 8px));width:60px;height:60px;border-radius:50%;border:none;background:var(--accent);color:var(--on-accent);font-size:32px;line-height:1;box-shadow:var(--sh-3);cursor:pointer;z-index:20;transition:transform var(--dur) var(--ease)}
@media (hover:hover) and (pointer:fine){.fab:hover{transform:scale(1.06)}} .fab:active{transform:scale(.94)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(90px,calc(env(safe-area-inset-bottom,0px) + 82px));z-index:50;background:var(--ink);color:var(--bg);border-radius:var(--r-md);padding:10px 14px;box-shadow:var(--sh-3);display:flex;gap:var(--sp-3);align-items:center;max-width:min(92vw,460px);font-size:13px}
.toast button{border:none;background:none;color:inherit;font-weight:600;text-decoration:underline;cursor:pointer;font-size:13px}
.sheetbg{position:fixed;inset:0;background:rgba(10,18,14,.5);z-index:40}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);max-height:94vh;overflow:auto;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;padding:var(--sp-4) max(16px,env(safe-area-inset-left,0px)) calc(var(--sp-4) + env(safe-area-inset-bottom,0px));box-shadow:var(--sh-3);display:grid;gap:var(--sp-3)}
@media (min-width:700px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:20px}}
.sheet input,.sheet select{font-size:16px}
.sh-h{display:flex;justify-content:space-between;align-items:center;font:600 18px var(--font-display)}
.sh-h button{border:none;background:none;font-size:24px;cursor:pointer;width:36px;height:36px;border-radius:var(--r-sm)}
.sheet input[type=text],.sheet input[type=number],.sheet select{height:42px;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:0 var(--sp-3)}
.amt{display:flex;align-items:center;gap:var(--sp-2);border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:0 var(--sp-4)}
.amt:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.amt span{font:500 22px var(--font-num);color:var(--muted)}
.sheet .amt input{border:none;background:none;height:66px;font:500 34px var(--font-num);padding:0;outline:none;text-align:left}
.grp{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.cp{height:40px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;font-size:14px;font-weight:500;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.cp.sm{height:32px;padding:0 12px;font-size:12px}
@media (hover:hover) and (pointer:fine){.cp:hover{border-color:var(--cc,var(--accent))}}
.cp[aria-checked="true"]{border-color:var(--cc,var(--accent));background:color-mix(in srgb,var(--cc,var(--accent)) 18%,var(--surface));font-weight:600}
.fld{display:grid;gap:var(--sp-1);font-size:12px;color:var(--muted)}
.srow{display:grid;grid-template-columns:1fr 92px 72px;gap:var(--sp-2)}
.sdest{font-size:12px;color:var(--muted)}
.sdest.err{color:var(--bad);font-weight:600}
.sact{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.sact .b{height:46px;font-size:15px}
@media (max-width:680px){.hero{padding:var(--sp-4)}.hero h1{font-size:30px}.hero-v{font-size:34px}}

@media (max-width:520px){.bt{display:none}.ctl button,.ctl select{padding:0 8px;font-size:12px}.kv{font-size:17px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:26px}}

/* ===== Refinamiento visual ===== */
header{background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.hero{background-image:radial-gradient(520px 220px at 92% -10%,rgba(255,255,255,.16),transparent 70%),radial-gradient(380px 200px at 0% 110%,rgba(60,201,166,.18),transparent 70%),linear-gradient(135deg,var(--hero-a),var(--hero-b));padding:28px var(--sp-5)}
.hero .hint{font-size:13px;opacity:.8}
.hero-v{font-size:46px;letter-spacing:-.02em}
.kpi{padding:14px 14px 14px 20px;border-radius:var(--r-md)}
.kpi::before{left:0;top:14px;bottom:14px;width:4px;height:auto;border-radius:0 4px 4px 0}
.kl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.kv{font-size:22px;margin-top:4px}
.sh{padding:12px 16px;gap:10px}
.sh i{width:22px;height:22px;border-radius:7px;background:color-mix(in srgb,var(--h) 28%,transparent);display:grid;place-items:center}
.sh i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--h)}
.sh.solid i{display:none}
.cb h2.ttl::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle}
.cb{padding:16px 18px}
.mcard{padding:14px 16px}
.mcard .mv{font-size:18px}
input[type=text],input[type=number]{transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow);outline:none}
.tot{font-size:13px}
.tab{padding:7px 13px}
.banner{border-radius:var(--r-md)}
@media (max-width:680px){.hero{padding:20px var(--sp-4)}.hero-v{font-size:36px}}
.bcard .add{align-self:flex-start}
:root{--h-liq:#C98A1E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--h-liq:#E5B04F}}
:root[data-theme="dark"]{--h-liq:#E5B04F}

.hero-main{display:grid;gap:var(--sp-3);min-width:0;align-content:start}
.hero.with-liq{gap:var(--sp-5)}
@media (min-width:900px){.hero.with-liq{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr)}}
.liq{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:var(--sp-2);min-width:0}
.liq-v{font:500 26px/1.1 var(--font-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.liq-rows{display:grid;gap:2px}
.liq .rw{min-width:0;margin-bottom:4px}
.liq .rw input{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:var(--hero-ink)}
.liq .rw input::placeholder{color:rgba(255,255,255,.6)}
.liq .rw input:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.liq .x{color:rgba(255,255,255,.75)}
@media (hover:hover) and (pointer:fine){.liq .x:hover{color:#fff}}
.liq .add{margin:0;align-self:flex-start;background:transparent;color:inherit;border-color:rgba(255,255,255,.4);height:30px;font-size:12px}
@media (hover:hover) and (pointer:fine){.liq .add:hover{background:rgba(255,255,255,.12);border-color:#fff}}
button.b.danger{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.cpb{flex-wrap:wrap}

/* ===== Sistema de diseño "Mis finanzas" (ver MASTER.md) =====
   Estilo: Minimalismo / Swiss · Tipografía: IBM Plex (Financial Trust) · Paleta: Personal Finance Tracker
   Diales: variance 3 · motion 4 · density 6 */
:root{
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --bg:#EDF1F5; --surface:#FBFCFD; --surface-2:#F1F5F9; --ink:#0F172A; --muted:#475569; --line:#D9E1EA;
  --accent:#047857; --on-accent:#FFFFFF; --accent-soft:#D1FAE5;
  --c-ing:#2563EB; --c-fij:#2563EB; --c-gas:#EA580C; --c-hor:#EA580C; --c-aho:#059669; --c-inv:#7C3AED; --c-res:#94A3B8;
  --bad:#B91C1C; --bad-bg:#FEE2E2; --ok:#047857; --ok-bg:#D1FAE5; --warn:#92400E; --warn-bg:#FEF3C7;
  --hero-a:#0F172A; --hero-b:#065F46; --hero-ink:#F8FAFC;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F172A; --surface:#192134; --surface-2:#222C42; --ink:#F8FAFC; --muted:#94A3B8; --line:rgba(255,255,255,.10);
  --accent:#34D399; --on-accent:#052E22; --accent-soft:#0F3B30;
  --c-ing:#60A5FA; --c-fij:#60A5FA; --c-gas:#FB923C; --c-hor:#FB923C; --c-aho:#34D399; --c-inv:#A78BFA; --c-res:#64748B;
  --bad:#FCA5A5; --bad-bg:#3F1D1D; --ok:#6EE7B7; --ok-bg:#0F3B30; --warn:#FCD34D; --warn-bg:#3A2F10;
  --hero-a:#0B1222; --hero-b:#064E3B}}
:root[data-theme="dark"]{
  --bg:#0F172A; --surface:#192134; --surface-2:#222C42; --ink:#F8FAFC; --muted:#94A3B8; --line:rgba(255,255,255,.10);
  --accent:#34D399; --on-accent:#052E22; --accent-soft:#0F3B30;
  --c-ing:#60A5FA; --c-fij:#60A5FA; --c-gas:#FB923C; --c-hor:#FB923C; --c-aho:#34D399; --c-inv:#A78BFA; --c-res:#64748B;
  --bad:#FCA5A5; --bad-bg:#3F1D1D; --ok:#6EE7B7; --ok-bg:#0F3B30; --warn:#FCD34D; --warn-bg:#3A2F10;
  --hero-a:#0B1222; --hero-b:#064E3B}
h1,h2,.bt,.hero h1{letter-spacing:-.015em}
h1{font-weight:700}
.hero-v,.kv,.mv,.liq-v{font-family:var(--font-num)}
.kl,.hero-k{font-family:var(--font-num)}

.syn{height:34px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:0 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.syn[data-s="saved"]{color:var(--ok);border-color:var(--ok)}
.syn[data-s="error"],.syn[data-s="conflict"]{color:var(--bad);border-color:var(--bad)}
.syn[data-s="saving"],.syn[data-s="loading"],.syn[data-s="dirty"]{color:var(--warn)}
.gs{margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid var(--line);display:grid;gap:var(--sp-3)}
.gs h3{margin:0;font:600 14px var(--font-display)}
.chk{display:flex;align-items:center;gap:var(--sp-2);font-size:13px}
.gs .qa{margin:0}
@media (max-width:520px){.syn{max-width:96px;overflow:hidden;text-overflow:ellipsis}}

.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.acts button{height:34px;padding:0 12px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:inherit;font:500 12.5px var(--font-body,inherit);cursor:pointer}
@media (hover:hover) and (pointer:fine){.acts button:hover{background:rgba(255,255,255,.22)}}
.acts button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.cuad{display:grid;gap:var(--sp-2)}
.cr{display:grid;grid-template-columns:1fr minmax(96px,120px) 84px;gap:var(--sp-2);align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.cr input{height:38px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:0 10px;font-family:var(--font-num);text-align:right;min-width:0}
.cd{font-size:12px;text-align:right}.cd.ok{color:var(--ok)}.cd.bad{color:var(--bad)}
@media (max-width:520px){.cr{grid-template-columns:1fr 100px}.cd{grid-column:1/-1;text-align:left}}

.caplink{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:8px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-size:13px;font-weight:600}
@media (hover:hover) and (pointer:fine){.caplink:hover{filter:brightness(1.05)}}
.cap-wrap{max-width:560px;margin:0 auto;display:grid;gap:var(--sp-3);padding-top:var(--sp-2)}
.cap-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cap-l{color:var(--muted);font-size:13px}
.cap-link{color:var(--accent);font-size:13px;text-decoration:none;white-space:nowrap}
.cap-big{font-family:var(--font-num);font-weight:600;font-size:clamp(40px,13vw,64px);line-height:1;letter-spacing:-.02em}
.cap-big.neg{color:var(--bad)}
.cap-btn{height:60px;border:none;border-radius:16px;background:var(--accent);color:var(--on-accent);font:600 18px var(--font-body,inherit);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.cap-btn:active{transform:scale(.98)}
.cap-liq{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.cap-liq b{font-family:var(--font-num)}
.cap-recent{border:1px solid var(--line);border-radius:12px;padding:4px 14px 8px}
.cap-rt{font-size:12px;color:var(--muted);margin:10px 0 2px}
.cap-r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.cap-r span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap-r b{font-family:var(--font-num);white-space:nowrap}.cap-r b.g{color:var(--bad)}
.cap-tip{text-align:center}

.cbadge{margin-left:auto;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.cardtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:2px 0 8px}
.carddebt,.cardav{font-family:var(--font-num);font-weight:600;font-size:20px}
.cardmeter{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-bottom:10px}
.cardmeter>div{height:100%;border-radius:999px;transition:width .25s}
.cardlim{max-width:220px;margin:0 0 10px}
.cardpay{margin-top:8px;width:100%}
.capx{border:none;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 2px;margin-left:4px}
@media (hover:hover) and (pointer:fine){.capx:hover{color:var(--bad)}}
.cap-r{align-items:center}

/* ===== Pulido visual v2 ===== */
html{font-optical-sizing:auto;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,.bt,.sh,.hero h1,.mh b,.cph{font-optical-sizing:auto}
.bt{font-weight:700;letter-spacing:-.02em}
h1{letter-spacing:-.03em}
.hero{position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 120% at 100% 0,rgba(255,255,255,.14),transparent 55%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-v{letter-spacing:-.02em}
.tab{letter-spacing:-.01em}
.tab[aria-current="page"]{box-shadow:0 2px 10px var(--glow),0 1px 0 rgba(0,0,0,.04)}
.card{transition:box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
@media (hover:hover) and (pointer:fine){.secs .card:hover,.g2 .card:hover,.g3 .card:hover{box-shadow:var(--sh-2)}}
.kv,.hero-v,.carddebt,.cardav,.cap-big{font-feature-settings:"tnum" 1}
.caplink{transition:filter var(--dur) var(--ease),transform var(--dur) var(--ease)}
.caplink:active{transform:scale(.97)}
.cap-btn{transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),filter var(--dur) var(--ease)}
@media (hover:hover) and (pointer:fine){.cap-btn:hover{filter:brightness(1.06);box-shadow:0 8px 24px var(--glow)}}
.sh{letter-spacing:-.01em}
.sh.solid{box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)}
.mv{letter-spacing:-.01em}

.welcome{padding:var(--sp-5);margin-bottom:var(--sp-4);border-left:4px solid var(--accent)}
.welcome h2{font:700 22px var(--font-display);letter-spacing:-.02em;margin:0 0 6px}
.welcome-ul{margin:10px 0 14px;padding-left:18px;display:grid;gap:5px}
.welcome .b.p{height:40px}
.cap-streak{font-size:13px;color:var(--muted);text-align:center;margin-top:2px}
.cap-streak b{color:var(--accent);font-family:var(--font-num)}
@media (max-width:560px){.rw.ring,.rw.rgas,.rw.raho{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 84px!important;min-width:0!important;row-gap:6px;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line)}.rw.lb.ring,.rw.lb.rgas,.rw.lb.raho,.rw.lb.reur{display:none}.rw.ring>:first-child,.rw.rgas>:first-child,.rw.raho>:first-child{grid-column:1/3}.rw.ring>.rwx,.rw.rgas>.rwx,.rw.raho>.rwx{grid-column:3;grid-row:1}.rw.reur{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px!important;min-width:0!important;row-gap:6px;margin-bottom:8px}.rw.reur>.x{grid-column:3;grid-row:1/span 2;align-self:center}.kv{font-size:clamp(14px,4.4vw,18px);white-space:nowrap}}
@media (pointer:coarse){.x{width:40px;height:40px;font-size:18px}.rw .rwx .x{width:38px}.fab{width:54px;height:54px}}
/* Celular: botones de 44 px como mínimo para el dedo */
@media (pointer:coarse){select,.ctl button,.caplink{height:44px}.nav{width:44px;height:44px}.curbtn{min-width:44px;min-height:44px}.toast [data-undo]{min-height:44px;padding:0 10px}}
/* El + se esconde al bajar (para no tapar los montos de la derecha) y vuelve al subir */
.fab.oculto{transform:translateY(calc(100% + 40px));pointer-events:none}
/* El aviso usa el ancho que necesita (antes se apretaba a la mitad de la pantalla) */
.toast{width:max-content}
.sh.solid .cbadge{color:#fff;border-color:rgba(255,255,255,.75)}
.mwrap{position:relative;display:block;min-width:0}.mwrap input{padding-left:24px!important;width:100%}.curb{position:absolute;left:8px;top:50%;transform:translateY(-50%);font:600 11px var(--mono,ui-monospace,monospace);color:var(--accent);pointer-events:none}.curbtn{font:inherit;color:inherit;background:var(--surface-2,transparent);border:1px solid var(--line);border-radius:8px;padding:2px 8px;cursor:pointer}.curbtn:disabled{cursor:default;opacity:.8}.ahonote{margin:8px 15px;padding:8px 10px;border-radius:8px;background:var(--surface-2,rgba(0,0,0,.04))}.ahoflow{margin:6px 15px}.movl{margin:10px 15px;display:grid;gap:4px}.movi{display:grid;grid-template-columns:64px 1fr auto;gap:8px;font-size:13px;padding:4px 0;border-top:1px solid var(--line)}.ahm{display:grid;gap:6px;margin:6px 0 10px}
.tcm .cb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px}.tcm .cb>.ttl{margin:0}.tcm .cb>.ms{flex:1 0 100%;margin:0}.tcm-row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:4px 0}.tcm-row label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:120px;flex:0 1 160px}.tc-date{margin:-2px 0 10px}
#rc-src{min-width:120px}

.cardfields{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);margin:0 0 10px}
.cardfields .fld{margin:0}
@media (max-width:360px){.cardfields{grid-template-columns:1fr}}

.rwx{display:flex;gap:2px;justify-content:flex-end;align-items:center}

    const dec=lc>ld?',':'.',mil=dec===','?'.':',';

    if(ent.split(mil).some((g,i)=>i>0?g.length!==3:g.length<1||g.length>3))return NaN;

}

function drawResumen(){
  const ms=S[year],D=ms.map(dv);if(!D.some(x=>x.on))return;
  const b=base(true),t=k=>D.reduce((a,x)=>a+x[k],0),curI=(year===String(now.getFullYear()))?now.getMonth():-1;
  const live=(ds,c)=>curI<0?ds:Object.assign(ds,{segment:{borderDash:x=>x.p1DataIndex===curI?[5,4]:undefined},pointBackgroundColor:ABR.map((_,j)=>j===curI?cv('--surface'):c),pointBorderColor:c});
  const col=(l,d,c,w)=>({label:l,data:d,backgroundColor:c,borderColor:c,borderRadius:4,maxBarThickness:w||10,tension:.25,pointRadius:3});
  mkChart('r1',{type:ctype('r1','bar'),data:{labels:ABR,datasets:[col('Ingreso',D.map(x=>x.ing),cv('--c-ing')),col('Gastado',D.map(x=>x.gas),cv('--c-gas')),col('Ahorrado',D.map(x=>x.aho),cv('--c-aho'))]},options:{...b,onClick:goMonth,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:tipMoney},scales:axes()}});
  const yrs=YEARS.filter(y=>S[y].some(m=>dv(m).on)),pal=[cv('--c-ing'),cv('--c-aho'),cv('--c-inv'),cv('--c-fij')];
  if(document.getElementById('r5'))mkChart('r5',{type:ctype('r5','line'),data:{labels:ABR,datasets:yrs.map((y,j)=>{const ds={label:y,data:S[y].map(m=>{const d=dv(m);return d.on?d.aho:null;}),borderColor:pal[j%4],backgroundColor:pal[j%4],borderRadius:4,maxBarThickness:10,tension:.25,pointRadius:3,borderWidth:y===year?3:1.8,spanGaps:false};return (y===String(now.getFullYear())&&curI>=0)?live(ds,pal[j%4]):ds;})},options:{...b,interaction:{mode:'index',intersect:false},plugins:{legend:{display:true,labels:{color:cv('--muted'),boxWidth:10,font:{size:11}}},tooltip:tipMoney},scales:axes()}});
  const l2=live({...col('Ahorro',D.map((x,j)=>(curI>=0&&j>curI)?null:(x.ing>0?+(x.aho/x.ing*100).toFixed(1):null)),cv('--c-aho'),22),pointRadius:4,spanGaps:false},cv('--c-aho'));
  mkChart('r2',{type:ctype('r2','line'),data:{labels:ABR,datasets:[l2,{type:'line',label:'Meta',data:ABR.map(()=>cfg.meta),borderColor:cv('--muted'),borderDash:[5,4],pointRadius:0,borderWidth:1.5}]},options:{...b,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+c.parsed.y+'%'}}},scales:axes(v=>v+'%')}});
  const t3=ctype('r3','bar'),hc=D.map(x=>x.hor>cfg.alerta?cv('--bad'):cv('--c-hor'));
  mkChart('r3',{type:'bar',data:{labels:ABR,datasets:[{type:t3,label:'Gastos hormiga',data:D.map(x=>x.hor),backgroundColor:t3==='bar'?hc:cv('--c-hor'),borderColor:cv('--c-hor'),pointBackgroundColor:hc,pointRadius:4,tension:.25,borderRadius:4,maxBarThickness:22},{type:'line',label:'Alerta',data:ABR.map(()=>cfg.alerta),borderColor:cv('--muted'),borderDash:[5,4],pointRadius:0,borderWidth:1.5}]},options:{...b,onClick:goMonth,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:tipMoney},scales:axes()}});
  const t4=ctype('r4','doughnut');
  mkChart('r4',{type:t4,data:{labels:['Gastos fijos','Gastos hormiga','Ahorros','Inversión'],datasets:[{data:[t('fij'),t('hor'),Math.max(0,t('aho')),t('inv')],backgroundColor:[cv('--c-fij'),cv('--c-hor'),cv('--c-aho'),cv('--c-inv')],borderColor:cv('--surface'),borderWidth:2}]},options:{...b,cutout:t4==='doughnut'?'64%':0,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.label+': '+fmt(c.parsed)}}}}});
  /* Cascada: a dónde fue el ingreso del año (barras flotantes) */
  if(document.getElementById('r6')){
    const steps=[['Ingreso',t('ing'),'--muted'],['Fijos',-t('fij'),'--c-fij'],['Hormiga',-t('hor'),'--c-hor'],['Inversión',-t('inv'),'--c-inv'],['Ahorro',-t('aho'),'--c-aho']];
    let run=0;const bars=[],cols=[],mags=[];
    steps.forEach(s=>{const start=run;run+=s[1];bars.push([Math.min(start,run),Math.max(start,run)]);cols.push(cv(s[2]));mags.push(s[1]);});
    bars.push([Math.min(0,run),Math.max(0,run)]);cols.push(cv('--accent'));mags.push(run);
    mkChart('r6',{type:'bar',data:{labels:['Ingreso','Fijos','Hormiga','Inversión','Ahorro','Queda'],datasets:[{data:bars,backgroundColor:cols,borderColor:cols,borderRadius:4,maxBarThickness:46}]},options:{...b,plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>c[0].label,label:c=>{const m=mags[c.dataIndex];return ' '+(m<0?'−':'')+fmt(Math.abs(m));}}}},scales:axes()}});
  }
  /* Capital acumulado: ahorro + inversión acumulados mes a mes */
  if(document.getElementById('r7')){
    let acc=0,started=false;const cap=D.map((x,j)=>{if(x.on)started=true;if(!started||(curI>=0&&j>curI))return null;acc+=x.inv;return Math.round((x.sAho+acc)*100)/100;});
    mkChart('r7',{type:ctype('r7','line'),data:{labels:ABR,datasets:[live({label:'Capital acumulado',data:cap,borderColor:cv('--c-aho'),backgroundColor:cv('--c-aho'),borderWidth:2.5,tension:.25,pointRadius:3,maxBarThickness:22,borderRadius:4,spanGaps:true,fill:false},cv('--c-aho'))]},options:{...b,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:tipMoney},scales:axes()}});
  }
}

/* ---------- Detalle de un mes ---------- */

/* Número legible en cada día del calendario: con mucho color de fondo, el texto normal se pierde
   (en temas oscuros el acento es claro; en los claros, oscuro). Se usa el texto normal o el color
   de la superficie, el que contraste más; si ninguno llega a 4.5:1, se mueve un poco la intensidad. */
let hmPal=null;
function hmInk(){
  const g=document.getElementById('hmgrid');if(!g)return;const cells=g.querySelectorAll('.hmcell[data-p]');if(!cells.length)return;
  const pk=themeKey();
  if(!hmPal||hmPal.k!==pk){
    const pr=document.createElement('i');g.appendChild(pr);
    const rgb=v=>{pr.style.color=v;const c=getComputedStyle(pr).color,n=(c.match(/[\d.]+/g)||[]).map(Number);return /^color\(/.test(c)?n.slice(0,3).map(x=>x*255):n.slice(0,3);};
    hmPal={k:pk,acc:rgb('var(--accent)'),s2:rgb('var(--surface-2)'),fg:rgb('var(--fg)'),su:rgb('var(--surface)')};pr.remove();
  }
  const {acc,s2,fg,su}=hmPal;
  const lum=c=>{const l=c.map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4;});return .2126*l[0]+.7152*l[1]+.0722*l[2];};
  const cr=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
  const ink=p=>{const bg=acc.map((a,i)=>a*p/100+s2[i]*(1-p/100)),f=cr(fg,bg),s=cr(su,bg);return f>=s?{c:f,v:''}:{c:s,v:'var(--surface)'};};
  cells.forEach(el=>{const p0=+el.dataset.p;let p=p0,k=ink(p);
    for(let d=2;k.c<4.5&&d<=40;d+=2){for(const q of [p0+d,p0-d]){if(q<14||q>100)continue;const t=ink(q);if(t.c>=4.5){p=q;k=t;break;}}}
    if(p!==p0)el.style.background=`color-mix(in srgb, var(--accent) ${p}%, var(--surface-2))`;
    el.firstChild.style.color=k.v;});
}

function track(e,onMove,onEnd){
  const mv=ev=>{if(ev.pointerId===e.pointerId)onMove(ev);};
  const up=ev=>{if(ev.pointerId!==e.pointerId)return;removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);onEnd();};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}
function startDrag(e,c,board){
  c.classList.add('dragging');
  track(e,ev=>{
    if(ev.clientY<90)scrollBy(0,-14);else if(ev.clientY>innerHeight-90)scrollBy(0,14);
    const over=document.elementsFromPoint(ev.clientX,ev.clientY).find(x=>x.classList&&x.classList.contains('bcard')&&x!==c&&!x.hidden);
    if(!over)return;
    const rc=over.getBoundingClientRect(),bw=board.getBoundingClientRect().width;
    const before=rc.width<bw*.9?(ev.clientX<rc.left+rc.width/2):(ev.clientY<rc.top+rc.height/2);
    if(before){if(over.previousElementSibling!==c)board.insertBefore(c,over);}
    else if(over.nextElementSibling!==c)board.insertBefore(c,over.nextSibling);
  },()=>{
    c.classList.remove('dragging');
    L().order=[].slice.call(board.querySelectorAll('.bcard')).map(x=>x.dataset.cid);saveLay();
  });
}

/* Reintentos con espera creciente (3, 6, 12… hasta 60 s). No se reintenta lo que no se arregla solo
   (fila demasiado grande, permisos). Además se sube al volver internet y al salir de la pestaña. */
function scheduleRetry(e,fn){
  clearTimeout(sync.retryT);
  const m=String((e&&e.message)||'');
  if(/2900|check constraint|violates|row-level security|llena/i.test(m))return;
  sync.fails=(sync.fails||0)+1;
  let d=Math.min(60000,3000*Math.pow(2,sync.fails-1));
  if(e&&e.status===429)d=Math.max(d,30000);
  sync.retryT=setTimeout(()=>{if(backend&&!sync.busy&&sync.state!=='conflict'&&(sync.dirty||!sync.ready))fn();},d);
  sync.msg=(sync.msg?sync.msg+' ':'')+'Se reintentará solo.';
}
function flushSync(){
  if(!backend||sync.busy||sync.state==='conflict'||authLocked)return;
  if(sync.ready&&sync.dirty){clearTimeout(sync.timer);clearTimeout(sync.retryT);pushNow(false);}
  else if(!sync.ready&&sync.state==='error'){clearTimeout(sync.retryT);loadFromSheet(true);}
}
window.addEventListener('online',flushSync);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSync();});
window.addEventListener('pagehide',flushSync);
async function pushNow(force){
  if(!backend)return;if(backend.name==='mcp'&&!sync.id)return;
  if(sync.busy){sync.again=true;return;}
  sync.busy=true;sync.state='saving';updateChip();
  try{
    if(!force){const remote=await backend.stamp();if(remote&&remote!==sync.stamp){sync.state='conflict';sync.msg='Tus datos cambiaron desde otro dispositivo. Usa «Recargar mis datos» para traer esos cambios o «Guardar todo ahora» para conservar los de aquí.';return;}}
    const rev=sync.rev||0;const rows=toRows();
    if(rows.length>2900)throw{code:'tool_error',message:'La pestaña Registro está llena (más de 2900 filas).'};
    const stamp='v'+Date.now();
    await backend.write(rows,[['cfg',JSON.stringify(cfg)],['layout',JSON.stringify(LAY)],['guardado',stamp]]);
    sync.stamp=stamp;sync.ready=true;sync.connected=true;sync.fails=0;clearTimeout(sync.retryT);const pend=(sync.rev||0)!==rev;sync.dirty=pend;persistSync();
    if(typeof HC!=='undefined')HC=null;
    if(pend){sync.again=true;}else{sync.state='saved';sync.at=Date.now();sync.msg='Guardado en tu cuenta ('+rows.length+' movimientos).';}
  }catch(e){sync.state='error';sync.msg=errMsg(e);scheduleRetry(e,()=>pushNow(false));}
  finally{sync.busy=false;updateChip();if(sync.again){sync.again=false;queueSync();}}
}
async function loadFromSheet(auto){
  if(auto&&sync.dirty&&backend){sync.ready=true;sync.msg='Subiendo cambios que quedaron pendientes…';await pushNow(false);if(sync.state==='conflict'){sync.msg='Tienes cambios en este dispositivo que no se subieron y tu cuenta también cambió desde otro. Tus datos de aquí se conservan: usa «Guardar todo ahora» para guardar estos o «Recargar mis datos» para traer los otros.';updateChip();}fxAuto();return;}
  if(!backend){sync.msg='Esta vista guarda tus datos solo en este navegador.';updateChip();return;}
  if(backend.name==='mcp'&&!sync.id){sync.state='error';sync.msg='Escribe el ID de tu hoja.';updateChip();return;}
  clearTimeout(sync.timer);sync.state='loading';updateChip();
  const rev0=sync.rev||0;
  try{
    const d=await backend.read();const rows=(Array.isArray(d.reg)?d.reg:[]).filter(Array.isArray);
    if((sync.rev||0)!==rev0){sync.ready=true;sync.dirty=true;persistSync();sync.msg='Seguiste editando mientras se cargaban tus datos: se conservaron tus cambios de aquí.';await pushNow(false);if(sync.state==='conflict'){sync.msg='Seguiste editando mientras se cargaban tus datos y tu cuenta también tenía cambios. Tus datos de aquí se conservan: usa «Guardar todo ahora» para guardar estos o «Recargar mis datos» para traer los otros.';}updateChip();return;}
    if(!rows.length){sync.ready=true;sync.msg='Tu cuenta estaba vacía: guardando tus datos…';await pushNow(true);toast('Tus datos se guardaron en tu cuenta');return;}
    applyRemote(rows,d.conf||[]);
    sync.ready=true;sync.connected=true;sync.dirty=false;persistSync();
    sync.state='saved';sync.at=Date.now();sync.msg='Datos cargados desde tu cuenta ('+rows.length+' movimientos).';
    render();toast('Datos cargados desde tu cuenta');fxAuto();
  }catch(e){sync.state='error';sync.msg=errMsg(e);updateChip();scheduleRetry(e,()=>loadFromSheet(true));}
}

/* Mercado (referencial): dólar y euro. Se usa para el euro y como plan B del dólar. */
async function fxFetch(){
  let last=null;
  for(const s of FX_SRC){
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
    try{
      const r=await fetch(s.url,{signal:ctl.signal,cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json(),pen=s.pen(j),eur=s.eur(j);
      if(pen>1&&pen<20&&eur>1&&eur<30)return{usd:pen,eur:eur,src:s.n};

function doAho(o){
  const m=S[o.yr][o.mo],cur=o.cur||curOf('aho'),def=curOf('aho');
  const nameOf=id=>id==='aho:+'?((o.desc||'').trim()||'Nueva cuenta'):id.slice(4);
  const mk=(n,v)=>{const r=row(n,Math.round(v*100)/100,o.fch,'');if(cur!==def)r.cur=cur;return r;};
  const add=r=>addRow(o.yr,o.mo,'aho',r),bal=n=>(ahoOf(o.yr,o.mo,n)||{v:0}).v;
  if(o.ax==='dep'||o.ax==='ret'){
    const sg=o.ax==='dep'?1:-1,nm=nameOf(o.from),r=mk(nm,sg*o.amt);

  }

  const fn=fa?nameOf(o.from):((m.liq[+o.from.slice(4)]||{}).c||'Liquidez'),tn=ta?nameOf(o.to):((m.liq[+o.to.slice(4)]||{}).c||'Liquidez');
  if(fa&&ta){const id='tr:'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),a=mk(fn,-o.amt),b=mk(tn,o.amt);a.t=b.t=id;add(a);add(b);}
  else if(fa){const r=mk(fn,-o.amt);r.src=o.to;add(r);applyDed(m,r,'aho');}
  else if(ta){const r=mk(tn,o.amt);r.src=o.from;if(o.goal)r.k=o.goal;add(r);applyDed(m,r,'aho');}
  else{

  }

}

  arr.sort((a,b)=>a.k-b.k);const l=arr.slice(-6);return l.length?l.reduce((a,x)=>a+x.g,0)/l.length:0;}

/* Reúne todo lo que va en el reporte para los meses de a hasta b (claves año*12+mes). */
function repData(a,b){
  const ms=trimEmpty(repMonths(a,b));
  if(!ms.length)return null;
  const first=ms[0],last=ms[ms.length-1];
  const mens=[],mov=[],fx=new Map(),T={ing:0,fij:0,hor:0,gas:0,aho:0,inv:0,res:0};
  ms.forEach(({y,i,m})=>{
    const d=dv(m);mens.push({y,i,per:perOf(y,i),ing:d.ing,fij:d.fij,hor:d.hor,gas:d.gas,aho:d.aho,inv:d.inv,res:d.res});
    Object.keys(T).forEach(k=>{T[k]+=d[k];});
    const per=perOf(y,i),liqN=r=>{const l=liqRef(m,r.src);return l?(l.c||'').trim():'';};
    const push=(sec,r,tipo,sent,concepto,cuenta,catg,sign)=>{
      const cur=rowCur(sec,r),tc=rateC(cur,m),amt=+r.m||0;
      if(cur!=='S/')fx.set(cur+'|'+per,{cur,per,tc});
      const sol=r2(amt*tc),o={sec,fecha:dayDate(y,i,r.f),y,i,dia:parseInt(r.f,10)||99,per,tipo,sent,concepto:(concepto||'').trim(),cat:catg||'',cuenta:cuenta||'',cur,amt,tc,sol,firm:sign?r2(sign*sol):sol};mov.push(o);return o;
    };
    (m.ing||[]).forEach(r=>{if(usedRow(r))push('ing',r,'Ingreso','Entrada',r.c,liqN(r),r.k,1);});
    (m.fij||[]).forEach(r=>{if(usedRow(r))push('fij',r,r.card?'Pago de tarjeta '+SECN[r.card]:'Gasto fijo','Salida',r.c,liqN(r),r.card?'Pago de tarjetas':(r.k||'Sin categoría'),-1);});
    (m.hor||[]).forEach(r=>{if(usedRow(r))push('hor',r,'Gasto variable','Salida',r.c,liqN(r),r.k||'Sin categoría',-1);});
    (m.inv||[]).forEach(r=>{if(usedRow(r))push('inv',r,'Inversión','Salida',r.c,liqN(r),r.k,-1);});
    (m.aho||[]).forEach(r=>{if(!usedRow(r))return;const k=ahoKind(r);
      const tipo={dep:'Depósito a ahorro',ret:'Retiro de ahorro',aj:'Ajuste de saldo de ahorro',tr:'Traspaso entre cuentas de ahorro'}[k];
      const sent={dep:'Hacia ahorro',ret:'Desde ahorro',aj:'Ajuste',tr:'Interno'}[k];
      push('aho',r,tipo,sent,r.k?'Meta: '+r.k:'',ahoName(r),'',(k==='dep'||k==='ret')?-1:0).ak=k;});
    CARDK.forEach(ck=>(m[ck]||[]).forEach(r=>{if(usedRow(r))push(ck,r,'Compra con tarjeta '+SECN[ck],'Cargo a tarjeta',r.c,'Tarjeta '+SECN[ck],r.k||'Sin categoría',-1);}));
  });
  mov.sort((p,q)=>mkey(p.y,p.i)-mkey(q.y,q.i)||p.dia-q.dia);
  Object.keys(T).forEach(k=>{T[k]=r2(T[k]);});
  /* Gastos por categoría (gastos fijos + variables, igual que «Total gastado») */
  const cm=new Map();mov.filter(x=>x.sec==='fij'||x.sec==='hor').forEach(x=>{const k=x.cat||'Sin categoría';cm.set(k,(cm.get(k)||0)+x.sol);});
  const cat=[...cm.entries()].map(([c,v])=>({c,v:r2(v)})).filter(x=>Math.abs(x.v)>=.005).sort((p,q)=>q.v-p.v);
  /* Ahorros por cuenta: saldo inicial + movimientos del período = saldo final */
  const pk=mkey(first.y,first.i)-1,py=String(Math.floor(pk/12)),pi=((pk%12)+12)%12;
  const ini=new Map(),fin=new Map();
  (S[py]?ahoAccts(py,pi):[]).forEach(a=>ini.set(a.c.toLowerCase(),a));
  ahoAccts(last.y,last.i).forEach(a=>fin.set(a.c.toLowerCase(),a));
  const am=new Map(),acc=k=>{if(!am.has(k))am.set(k,{dep:0,ret:0,aj:0,tr:0});return am.get(k);};
  mov.filter(x=>x.sec==='aho').forEach(x=>{const a=acc(x.cuenta.toLowerCase()),k=x.ak;
    if(k==='dep')a.dep+=x.sol;else if(k==='ret')a.ret+=-x.sol;else a[k]+=x.sol;});
  const names=new Map();[...ini.values(),...fin.values()].forEach(a=>names.set(a.c.toLowerCase(),a.c));
  mov.filter(x=>x.sec==='aho').forEach(x=>{if(!names.has(x.cuenta.toLowerCase()))names.set(x.cuenta.toLowerCase(),x.cuenta);});
  const ahorros=[...names.entries()].map(([k,c])=>{const a=am.get(k)||{dep:0,ret:0,aj:0,tr:0},i0=(ini.get(k)||{v:0}).v,f0=(fin.get(k)||{v:0}).v,tz=tasaOf(c);
    return {c,ini:r2(i0),dep:r2(a.dep),ret:r2(a.ret),aj:r2(a.aj),tr:r2(a.tr),fin:r2(f0),tasa:tz?tz.t+' '+(+tz.v).toFixed(2)+'%':'',gana:r2(ahoGana(f0,tz,360))};})
    .filter(a=>[a.ini,a.dep,a.ret,a.aj,a.tr,a.fin].some(v=>Math.abs(v)>=.005)).sort((p,q)=>q.fin-p.fin);
  /* Tarjetas de crédito */
  const tarjetas=CARDK.map(ck=>{let cons=0,pag=0;ms.forEach(({m})=>{cons+=sumIn(m,ck);pag+=paymentsTo(m,ck);});const deuda=cardEnding(last.y,last.i,ck),cur=curOf(ck);
    return {k:ck,n:SECN[ck],cur,cons:r2(cons),pag:r2(pag),deuda:r2(deuda),deudaS:r2(deuda*rateC(cur,last.m))};}).filter(t=>t.cons||t.pag||t.deuda);
  const lc=curOf('liq'),liq=(last.m.liq||[]).filter(r=>(r.c||'').trim()).map(r=>({c:r.c.trim(),cur:lc,v:r2(r.m),s:r2((+r.m||0)*rateC(lc,last.m))}));
  const label=first===last?perOf(first.y,first.i):perOf(first.y,first.i)+' – '+perOf(last.y,last.i);
  return {first,last,label,mens,mov,T,cat,ahorros,tarjetas,liq,fx:[...fx.values()],
    ahoTot:r2(ahorros.reduce((s,a)=>s+a.fin,0)),deudaTot:r2(tarjetas.reduce((s,t)=>s+t.deudaS,0)),liqTot:r2(liq.reduce((s,l)=>s+l.s,0)),
    tasa:T.ing>0?(T.aho+T.inv)/T.ing:null};
}

/* Reportes en segundo plano: el armado de PDF y Excel (lo pesado) corre en un Web Worker (reportes.js)
   y la pantalla sigue respondiendo. Si el navegador no permite workers, se carga el mismo archivo y corre aquí. */
const REP_JS='reportes.js?v=1';
function mkReport(fmt,R,o){
  const ctx={MES,who:repWho()},job={fmt,R,o:{det:o.det},ctx};
  const viaMain=()=>new Promise((res,rej)=>{
    if(window.MSRep)return res();
    const s=document.createElement('script');s.src=REP_JS;s.onload=()=>res();s.onerror=()=>{s.remove();rej(new Error('No pude cargar lo necesario para crear el reporte. Revisa tu conexión e intenta otra vez.'));};document.head.appendChild(s);
  }).then(()=>window.MSRep.build(job));
  if(!window.Worker)return viaMain();
  return new Promise((res,rej)=>{
    let w;try{w=new Worker(REP_JS);}catch(e){viaMain().then(res,rej);return;}
    w.onmessage=e=>{w.terminate();if(e.data.err)rej(new Error(e.data.err));else res(e.data.blob);};
    w.onerror=()=>{w.terminate();viaMain().then(res,rej);};
    w.postMessage(job);
  });
}

async function dlBlob(name,blob){
  if(dl){await dl.save({filename:name,data:blob});return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}

    ${st.p==='rango'?`<div class="rp-r"><label class="fld">Desde${sel('rp-a',st.a)}</label><label class="fld">Hasta${sel('rp-b',st.b)}</label></div>`:''}
    <div class="rp-l">Formato</div>
    <div class="grp" role="radiogroup" aria-label="Formato" id="rp-f">${chipH([['pdf','PDF · para enviar o imprimir'],['xlsx','Excel · para revisar las cifras']],st.f,'rf',true)}</div>
    <label class="fld">Nombre del titular (aparece en el reporte)<input type="text" id="rp-n" value="${esc(cfg.titular||'')}" placeholder="Tu nombre completo" autocomplete="name"></label>
    <label class="chk"><input type="checkbox" id="rp-d"${st.det?' checked':''}> Incluir el detalle de cada movimiento</label>
    <div class="rp-s" id="rp-s" role="status">${R?`<b>${esc(R.label)}</b> · ${R.mens.length} ${R.mens.length===1?'mes':'meses'} · ${R.mov.length} movimientos<br>Ingresos ${fmt(R.T.ing)} · Gastos ${fmt(R.T.gas)} · Resultado ${fmt(R.T.res)}`:'No hay movimientos en ese período. Elige otro.'}</div>
    <div class="sdest" id="rp-m" role="status"></div>

      b.disabled=true;const t0=b.textContent;b.textContent='Preparando…';msg.textContent='';

        await dlBlob(name,blob);msg.textContent='Listo: '+name;toast('Reporte listo: '+name);}

/* ---------- Tus datos: historial automático (30 días) y copia descargable ---------- */
const HKEY=KEY+'-hist',HDIAS=30;
const p2=n=>String(n).padStart(2,'0');
const hoyLima=()=>{const d=limaD();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};

function localHist(){try{const a=JSON.parse(localStorage.getItem(HKEY));return Array.isArray(a)?a:[];}catch(e){return [];}}
function localHistSet(a){a.sort((x,y)=>y.dia.localeCompare(x.dia)||x.tipo.localeCompare(y.tipo));
  for(let n=a.length;n>0;n--){try{localStorage.setItem(HKEY,JSON.stringify(a.slice(0,n)));return;}catch(e){}}}
function localKeep(tipo,s){const d=hoyLima(),lim=new Date(Date.parse(d)-HDIAS*864e5).toISOString().slice(0,10);
  const a=localHist().filter(h=>!(h.dia===d&&h.tipo===tipo)&&h.dia>=lim);a.push({dia:d,tipo,at:new Date().toISOString(),registro:s.registro,config:s.config});localHistSet(a);}

};

  const t=e.target;if(e.key!=='Enter'||e.isComposing||t.tagName!=='INPUT'||!t.dataset||!t.dataset.s||typeof view!=='number')return;
  if(t.dataset.k==='c'){const row=t.closest('.rw'),ins=row?[...row.querySelectorAll('input')]:[],nx=ins[ins.indexOf(t)+1];if(nx){e.preventDefault();nx.focus();if(nx.select)nx.select();}return;}
  if(t.dataset.k!=='m'&&t.dataset.k!=='f')return;
  e.preventDefault();const sc=t.dataset.s,i=+t.dataset.i,arr=S[year][view][sc];
  if(i>=arr.length-1){arr.push(row());pf=[sc,arr.length-1,'c'];save();render();}
  else{const nx=document.getElementById(sc+'-'+(i+1)+'-c');if(nx)nx.focus();}
});
app.addEventListener('pointerdown',e=>{
  if(!edit||(e.pointerType==='mouse'&&e.button!==0))return;
  const g=e.target.closest('[data-drag]'),r=e.target.closest('[data-rz]');if(!g&&!r)return;
  const c=e.target.closest('.bcard'),board=document.getElementById('board');if(!c||!board)return;
  e.preventDefault();closePanel();
  if(g)startDrag(e,c,board);else startResize(e,c,board);
});
document.addEventListener('click',e=>{
  const p=document.getElementById('cpanel');if(!p)return;
  const pc=e.target.closest('[data-pc]');
  if(pc&&p.contains(pc)){
    const id=p.dataset.id,k=pc.dataset.pc;
    if(k==='hide'){cs(id).hide=true;saveLay();closePanel();render();}
    else if(k==='reset'){delete L().c[id];saveLay();closePanel();render();}
    else if(k==='del'){
      if(pc.dataset.arm){cs(id).del=true;saveLay();closePanel();render();}
      else{pc.dataset.arm='1';pc.textContent='Confirmar eliminar';pc.classList.add('danger');}
    }
    else closePanel();
    return;
  }
  if(!p.contains(e.target)&&!e.target.closest('[data-cfgcard]'))closePanel();
});
function panelField(e,live){
  const t=e.target,p=document.getElementById('cpanel');
  if(!p||!p.contains(t)||!t.dataset.pf)return;
  const id=p.dataset.id,k=t.dataset.pf,s=cs(id);
  if(k==='t'){
    if(!live)return;
    s.t=t.value.trim()||undefined;saveLay();
    const el=document.querySelector('.bcard[data-cid="'+id+'"] .ttl');if(el)el.textContent=s.t||CNAME[id]||'';
    return;
  }
  if(live)return;
  if(k==='w')s.w=+t.value;
  else if(k==='h'){if(+t.value)s.h=+t.value;else delete s.h;}
  else if(k==='ty')s.ty=t.value;
  else if(k==='cur'){if(t.value==='S/')delete s.cur;else s.cur=t.value;}
  saveLay();render();
}
document.addEventListener('input',e=>panelField(e,true));
document.addEventListener('change',e=>panelField(e,false));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});
window.addEventListener('hashchange',()=>{closePanel();parseHash();render();window.scrollTo(0,0);});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);}catch(e){}
try{const th=localStorage.getItem(KEY+'-tema');if(th==='dark'||th==='light')document.documentElement.dataset.theme=th;}catch(e){}
if(window.Chart){Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;}
render();
initSync();initDl();
if(!IS_SB&&!IS_GAS)fxAuto();
if('serviceWorker' in navigator && !(window.claude&&window.claude.use) && !IS_GAS){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
