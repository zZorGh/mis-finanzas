  --bad:#B91C1C; --bad-bg:#FEE2E2; --ok:#047857; --ok-bg:#D1FAE5; --warn:#92400E; --warn-bg:#FEF3C7;

}

  --accent:#34D399; --on-accent:#052E22; --accent-soft:#0F3B30;
  --c-ing:#60A5FA; --c-fij:#60A5FA; --c-gas:#FB923C; --c-hor:#FB923C; --c-aho:#34D399; --c-inv:#A78BFA; --c-res:#64748B;
  --bad:#FCA5A5; --bad-bg:#3F1D1D; --ok:#6EE7B7; --ok-bg:#0F3B30; --warn:#FCD34D; --warn-bg:#3A2F10;
  --hero-a:#0B1222; --hero-b:#064E3B}}
:root[data-theme="dark"]{
  --bg:#0F172A; --surface:#192134; --surface-2:#222C42; --ink:#F8FAFC; --muted:#94A3B8; --line:rgba(255,255,255,.10);
  --accent:#34D399; --on-accent:#052E22; --accent-soft:#0F3B30;
  --c-ing:#60A5FA; --c-fij:#60A5FA; --c-gas:#FB923C; --c-hor:#FB923C; --c-aho:#34D399; --c-inv:#A78BFA; --c-res:#64748B;

/* Monto escrito por una persona: acepta «1,200», «1.200», «1,234.50», «1.234,50», «12,5», «S/ 12.50».
   Devuelve NaN si no es un número claro (letras, dos decimales, notación científica, Infinity, más de mil millones). */
function parseMonto(v){
  const t=String(v==null?'':v).trim().replace(/^(s\/\.?|\$|€|usd|pen|eur)\s*/i,'').replace(/\s+/g,'');
  if(!/^[\d.,]+$/.test(t)||!/\d/.test(t))return NaN;
  const lc=t.lastIndexOf(','),ld=t.lastIndexOf('.');
  let n;
  if(lc>=0&&ld>=0){
    const dec=lc>ld?',':'.',mil=dec===','?'.':',';
    if(t.split(dec).length!==2)return NaN;
    const ent=t.split(dec)[0];
    if(ent.split(mil).some((g,i)=>i>0?g.length!==3:g.length<1||g.length>3))return NaN;
    n=t.split(mil).join('').replace(dec,'.');
  }else if(lc>=0||ld>=0){
    const s=lc>=0?',':'.',p=t.split(s);
    if(p.length>2){if(p[0].length<1||p[0].length>3||!p.slice(1).every(x=>x.length===3))return NaN;n=p.join('');}
    else if(p[1].length===3&&p[0].length>=1&&p[0].length<=3&&p[0]!=='0')n=p[0]+p[1];
    else n=(p[0]||'0')+'.'+p[1];
  }else n=t;
  const x=parseFloat(n);
  return Number.isFinite(x)&&x>=0&&x<=1e9?x:NaN;
}

/* Índice lateral de Ajustes (escritorio). No usa el hash: el hash es la ruta de la app. */
let ajPin=null,ajRaf=0;
function ajMarca(){
  if(view!=='ajustes'){ajPin=null;return;}
  const cs=document.querySelectorAll('.ajc'),bs=document.querySelectorAll('[data-ajir]');if(!bs.length)return;
  let i=ajPin;
  if(i===null){const linea=document.getElementById('hdr').offsetHeight+60;i=0;cs.forEach((c,j)=>{if(c.getBoundingClientRect().top<=linea)i=j;});
    if(scrollY>0&&innerHeight+scrollY>=document.documentElement.scrollHeight-2)i=cs.length-1;}
  bs.forEach(b=>{if(+b.dataset.ajir===i)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-ajir]');if(!b)return;
  const c=document.querySelectorAll('.ajc')[+b.dataset.ajir];if(!c)return;ajPin=+b.dataset.ajir;
  c.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
  const h=c.querySelector('h3');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}
  ajMarca();});
/* La elegida se queda marcada (las últimas no llegan arriba) hasta que la persona vuelve a moverse. */
['wheel','touchstart','pointerdown','keydown'].forEach(t=>window.addEventListener(t,()=>{ajPin=null;},{passive:true,capture:true}));
window.addEventListener('scroll',()=>{if(view!=='ajustes')return;cancelAnimationFrame(ajRaf);ajRaf=requestAnimationFrame(ajMarca);},{passive:true});

  const l2=live({...col('Ahorro',D.map((x,j)=>(curI>=0&&j>curI)?null:(x.ing>0?+(x.aho/x.ing*100).toFixed(1):null)),cv('--c-aho'),22),pointRadius:4,spanGaps:false},cv('--c-aho'));

/* Tu semana: los últimos 7 días (hasta hoy) contra los 7 de antes. Solo gastos fijos y cotidianos (dinero que sale de tus cuentas), igual que «Gasto por día».
   Solo en el mes actual y cuando hay gastos en esta semana. Puede cruzar de mes: busca en los meses que toque. */
function semanaData(){
  const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),DAY=864e5,ini=new Date(t0-6*DAY),iniP=new Date(t0-13*DAY),finP=new Date(t0-7*DAY);
  const w={tot:0,n:0,cats:new Map(),dias:new Set(),porDia:new Map(),ant:0,antTot:0,antNo:0},p={tot:0},ms=new Set();
  for(let d=new Date(iniP);d<=t0;d=new Date(d.getTime()+DAY))ms.add(d.getFullYear()+'-'+d.getMonth());
  ms.forEach(k=>{const [y,mi]=k.split('-').map(Number),mm=(S[String(y)]||[])[mi];if(!mm)return;
    (mm.ing||[]).forEach(r=>{if(!usedRow(r)||!(+r.m>0))return;const dt=dayDate(y,mi,r.f);if(dt&&dt>=ini&&dt<=t0)w.dias.add(dt.getTime());});
    ['fij','hor'].forEach(s=>(mm[s]||[]).forEach(r=>{
      if(!usedRow(r)||!(+r.m>0))return;const dt=dayDate(y,mi,r.f);if(!dt)return;const v=(+r.m)*rateC(rowCur(s,r),mm);
      if(dt>=ini&&dt<=t0){w.tot+=v;w.n++;w.dias.add(dt.getTime());w.porDia.set(dt.getTime(),(w.porDia.get(dt.getTime())||0)+v);
        const c=r.card?'Pago de tarjetas':((r.k||'').trim()||'Sin categoría');w.cats.set(c,(w.cats.get(c)||0)+v);
        if(s==='hor'&&r.t==='ant'){w.ant++;w.antTot+=v;if(r.v===0)w.antNo+=v;}}
      else if(dt>=iniP&&dt<=finP)p.tot+=v;}));});
  return{w,p};
}

/* Cierre del mes: cuánto entró, cuánto salió, cuánto ahorraste, en qué se fue más y UNA sugerencia. Sale de los datos del mes, sin guardar nada nuevo.
   Se ve en los meses pasados con datos y en los últimos 3 días del mes actual; los primeros 7 días del mes siguiente, una franja invita a verlo. */
function cierreData(y,i){
  const m=(S[y]||[])[i];if(!m)return null;const D=dv(m);if(!D.on)return null;
  const py=i>0?y:String(+y-1),pi=i>0?i-1:11,pm=(S[py]||[])[pi],P=pm?dv(pm):null,cats=new Map();let antNo=0;

  let top=null,topN=null;cats.forEach((v,k)=>{if(!top||v>top.v)top={k,v};if(k!=='Sin categoría'&&k!=='Pago de tarjetas'&&(!topN||v>topN.v))topN={k,v};});

let hmPal=null;
function hmInk(){
  const g=document.getElementById('hmgrid');if(!g)return;const cells=g.querySelectorAll('.hmcell[data-p]');if(!cells.length)return;
  const pk=themeKey();
  if(!hmPal||hmPal.k!==pk){
    const pr=document.createElement('i');g.appendChild(pr);
    const rgb=v=>{pr.style.color=v;const c=getComputedStyle(pr).color,n=(c.match(/[\d.]+/g)||[]).map(Number);return /^color\(/.test(c)?n.slice(0,3).map(x=>x*255):n.slice(0,3);};
    hmPal={k:pk,acc:rgb('var(--accent)'),s2:rgb('var(--surface-2)'),fg:rgb('var(--fg)'),su:rgb('var(--surface)')};pr.remove();
  }
  const {acc,s2,fg,su}=hmPal;
  const lum=c=>{const l=c.map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4;});return .2126*l[0]+.7152*l[1]+.0722*l[2];};
  const cr=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
  const ink=p=>{const bg=acc.map((a,i)=>a*p/100+s2[i]*(1-p/100)),f=cr(fg,bg),s=cr(su,bg);return f>=s?{c:f,v:''}:{c:s,v:'var(--surface)'};};
  cells.forEach(el=>{const p0=+el.dataset.p;let p=p0,k=ink(p);
    for(let d=2;k.c<4.5&&d<=40;d+=2){for(const q of [p0+d,p0-d]){if(q<14||q>100)continue;const t=ink(q);if(t.c>=4.5){p=q;k=t;break;}}}
    if(p!==p0)el.style.background=`color-mix(in srgb, var(--accent) ${p}%, var(--surface-2))`;
    el.firstChild.style.color=k.v;});
}

/* Quita del concepto lo que sobra al hablar («gasté en taxi» → taxi, «compré una polera por» → polera, «me llegó el sueldo de» → sueldo). */
function limpiarConcepto(d){
  d=String(d||'').trim();
  d=d.replace(/^(?:me\s+)?almorc[eé](?=\s|$)/,'almuerzo').replace(/^(?:me\s+)?cen[eé](?=\s|$)/,'cena').replace(/^(?:me\s+)?desayun[eé](?=\s|$)/,'desayuno');
  d=d.replace(/^(?:me\s+)?(?:gast[eé]|pagu[eé]|pago|pagar|compr[eé]|com[ií]|cobr[eé]|recib[ií]|invert[ií]|ahorr[eé]|deposit[eé]|llev[eé]|saqu[eé]|lleg[oó]|pagaron|abonaron|depositaron|transfirieron)(?:\s+|$)/,'');
  for(let i=0;i<4;i++)d=d.replace(/^(?:el|la|los|las|un|una|unos|unas|de|del|en|por|para|al|a)\s+/,'').replace(/\s+(?:de|del|en|por|para|con|a|al|y|e|un|una|el|la|los|las)$/,'');
  return d.trim();
}

function fromRows(rows){
  const years={},mk=()=>({ing:[],fij:[],hor:[],bbva:[],bcp:[],oh:[],c4:[],c5:[],c6:[],c7:[],c8:[],aho:[],inv:[],liq:[],eur:[],p:[50,30,20],q:[50,30,20],nota:'',tot:false});
  rows.forEach(r=>{
    const y=String(r[0]||'').trim(),mi=parseInt(r[1],10)-1;
    if(!/^\d{4}$/.test(y)||!(mi>=0&&mi<12))return;
    if(!years[y])years[y]=Array.from({length:12},mk);
    const m=years[y][mi],ap=String(r[3]||'').trim();
    if(ap==='_Mes'){try{const j=JSON.parse(r[4]);if(j.p)m.p=j.p;if(j.q)m.q=j.q;m.nota=j.nota||'';m.tot=!!j.tot;if(j.az)m.az=1;}catch(e){}return;}
    if(ap==='_Card'){try{m.copen=JSON.parse(r[4]);}catch(e){}return;}
    if(ap==='_TC'){try{m.tc=JSON.parse(r[4]);}catch(e){}return;}
    if(ap==='_Mov'){try{m.mov=JSON.parse(r[4]);}catch(e){}return;}
    if(ap==='Apuntes'){m.eur.push({a:num(r[8]),b:num(r[9]),d:num(r[10]),s:num(r[11]),p:num(r[12])});return;}
    const k=APART_INV[ap];
    if(k){const o=row(r[4]||'',num(r[5]),r[7]||'',r[6]||'',r[13]||'',r[14]||''),c=String(r[8]||'').trim();if(CURS.indexOf(c)>0)o.cur=c;if(k==='aho'&&r[9])o.t=String(r[9]);
      if(typeof r[15]==='string'&&r[15]){try{const j=JSON.parse(r[15]);if(isObj(j))Object.keys(j).forEach(q=>{if(xOk(q)&&xVal(j[q]))o[q]=j[q];});}catch(e){}}
      m[k].push(o);}
  });
  Object.keys(years).forEach(y=>years[y].forEach(m=>{
    SECKEYS.forEach(k=>{if(!m[k].length)m[k]=(k==='liq')?LIQ():[row()];});
    if(!m.eur.length)m.eur=[{a:0,b:0,d:0,s:0,p:0}];

const SB_TIMEOUT='La conexión tardó demasiado.';
function sbCall(mk,ms){
  const ctl=new AbortController();let to;
  const lim=new Promise((_,rej)=>{to=setTimeout(()=>{try{ctl.abort();}catch(e){}rej({code:'tool_error',message:SB_TIMEOUT,timeout:true});},ms);});
  const ab=q=>(q&&typeof q.abortSignal==='function')?q.abortSignal(ctl.signal):q;
  return Promise.race([Promise.resolve(mk(ab)),lim]).finally(()=>clearTimeout(to));
}

/* Reintentos con espera creciente (3, 6, 12… hasta 60 s). No se reintenta lo que no se arregla solo
   (fila demasiado grande, permisos). Además se sube al volver internet y al salir de la pestaña. */
function scheduleRetry(e,fn){
  clearTimeout(sync.retryT);
  const m=String((e&&e.message)||'');
  if(/2900|check constraint|violates|row-level security|llena|demasiado grandes/i.test(m))return;
  sync.fails=(sync.fails||0)+1;
  let d=Math.min(60000,3000*Math.pow(2,sync.fails-1));
  if(e&&e.status===429)d=Math.max(d,30000);
  sync.retryT=setTimeout(()=>{if(backend&&!sync.busy&&sync.state!=='conflict'&&(sync.dirty||!sync.ready))fn();},d);
  sync.msg=(sync.msg?sync.msg+' ':'')+'Se reintentará solo.';
}
function flushSync(){
  if(!backend||sync.busy||sync.state==='conflict'||authLocked||tabClash)return;
  if(sync.ready&&sync.dirty){clearTimeout(sync.timer);clearTimeout(sync.retryT);pushNow(false);}
  else if(!sync.ready&&sync.state==='error'){clearTimeout(sync.retryT);loadFromSheet(true);}
}
window.addEventListener('online',flushSync);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSync();});
window.addEventListener('pagehide',flushSync);
async function pushNow(force){

  try{
    if(!force){const remote=await backend.stamp();if(remote&&remote!==sync.stamp){sync.state='conflict';sync.msg='Tus datos cambiaron desde otro dispositivo. Usa «Recargar mis datos» para traer esos cambios o «Guardar todo ahora» para conservar los de aquí.';return;}}
    const rev=sync.rev||0;const rows=toRows(backend.name==='sb');
    if(backend.name==='sb'){if(rows.length>8000&&JSON.stringify(rows).length>4000000)throw{code:'tool_error',message:'Tus datos ya son demasiado grandes para guardarse en tu cuenta. Descarga una copia en Ajustes y archiva los años anteriores.'};}
    else if(rows.length>2900)throw{code:'tool_error',message:'La pestaña Registro está llena (más de 2900 filas).'};
    const stamp='v'+Date.now();
    await backend.write(rows,[['cfg',JSON.stringify(cfg)],['layout',JSON.stringify(LAY)],['guardado',stamp]]);
    sync.stamp=stamp;sync.ready=true;sync.connected=true;sync.fails=0;clearTimeout(sync.retryT);const pend=(sync.rev||0)!==rev;sync.dirty=pend;persistSync();
    if(typeof HC!=='undefined')HC=null;
    if(pend){sync.again=true;}else{sync.state='saved';sync.at=Date.now();sync.msg='Guardado en tu cuenta ('+rows.length+' movimientos).';}
  }catch(e){sync.state='error';sync.msg=errMsg(e);scheduleRetry(e,()=>pushNow(false));}
  finally{sync.busy=false;updateChip();if(sync.again){sync.again=false;queueSync();}}
}
async function loadFromSheet(auto){

    if(!rows.length){sync.ready=true;sync.msg='Tu cuenta estaba vacía: guardando tus datos…';await pushNow(true);toast('Tus datos se guardaron en tu cuenta');return;}

async function fxFetch(){
  let last=null;
  for(const s of FX_SRC){
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
    try{
      const r=await fetch(s.url,{signal:ctl.signal,cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json(),pen=s.pen(j),eur=s.eur(j);
      if(pen>1&&pen<20&&eur>1&&eur<30)return{usd:pen,eur:eur,src:s.n};
      throw new Error('datos fuera de rango');
    }catch(e){last=e;}finally{clearTimeout(to);}
  }
  throw last||new Error('sin conexión');
}

  try{const blob=new Blob([data],{type:name.endsWith('.json')?'application/json':'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);bkMsg('Descargado '+name+'.');}
  catch(e){bkMsg('No se pudo descargar en esta vista.',true);}
}
const csvCell=v=>{const t=String(v==null?'':v).replace(/^'/,'');return /[",\n;]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
function restoreFrom(text){
  let j;try{j=JSON.parse(text);}catch(e){bkMsg('Ese archivo no es un respaldo válido.',true);return;}
  if(!j||typeof j.S!=='object'||!j.cfg){bkMsg('Ese archivo no parece un respaldo de Mis finanzas.',true);return;}
  const ys=Object.keys(j.S);
  if(!ys.length||!ys.every(y=>/^\d{4}$/.test(y)&&Array.isArray(j.S[y])&&j.S[y].length===12)){bkMsg('El respaldo tiene un formato que no reconozco.',true);return;}
  try{histApi.keep('antes_de_restaurar',snapNow()).catch(()=>{});HC=null;}catch(e){}
  ys.forEach(y=>{if(YEARS.indexOf(y)<0)YEARS.push(y);});YEARS.sort();
  const sj=saneS(j.S),ns={};YEARS.forEach(y=>{ns[y]=sj[y]||Array.from({length:12},blank);});
  S=ns;cfg=saneCfg(j.cfg);if(isObj(j.LAY))LAY=saneLay(j.LAY);applyBanks();
  if(!S[year])year=YEARS[YEARS.length-1];
  save();saveLay();render();toast('Respaldo restaurado');
}

const ISO={'S/':'PEN','$':'USD','€':'EUR'};
const r2=v=>Math.round((+v||0)*100)/100;
const mkey=(y,i)=>(+y)*12+i;
const perOf=(y,i)=>MES[i]+' '+y;
const dmy=d=>d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():'';
function repMonths(a,b){const out=[];YEARS.slice().sort().forEach(y=>{for(let i=0;i<12;i++){const k=mkey(y,i);if(k>=a&&k<=b&&S[y]&&S[y][i])out.push({y,i,m:S[y][i]});}});return out;}
function trimEmpty(ms){let s=0,e=ms.length-1;while(s<=e&&!dv(ms[s].m).on)s++;while(e>=s&&!dv(ms[e].m).on)e--;return ms.slice(s,e+1);}
const dayDate=(y,i,f)=>{const d=parseInt(f,10);if(!(d>=1))return null;const last=new Date(+y,i+1,0).getDate();return new Date(+y,i,Math.min(d,last));};
const usedRow=r=>r&&(((r.c||'').trim())||+r.m);
function avgGasto(){if(!passOn)return avgGasto0();if(passAvg===undefined)passAvg=avgGasto0();return passAvg;}
function avgGasto0(){const now=limaD(),cy=now.getFullYear(),ci=now.getMonth(),arr=[];
  YEARS.forEach(y=>(S[y]||[]).forEach((m,i)=>{if(+y>cy||(+y===cy&&i>=ci))return;const g=dv(m).gas;if(g>0)arr.push({k:+y*12+i,g});}));
  arr.sort((a,b)=>a.k-b.k);const l=arr.slice(-6);return l.length?l.reduce((a,x)=>a+x.g,0)/l.length:0;}

/* Reúne todo lo que va en el reporte para los meses de a hasta b (claves año*12+mes). */
function repData(a,b){
  const ms=trimEmpty(repMonths(a,b));
  if(!ms.length)return null;
  const first=ms[0],last=ms[ms.length-1];
  const mens=[],mov=[],fx=new Map(),T={ing:0,fij:0,hor:0,gas:0,aho:0,inv:0,res:0};
  ms.forEach(({y,i,m})=>{
    const d=dv(m);mens.push({y,i,per:perOf(y,i),ing:d.ing,fij:d.fij,hor:d.hor,gas:d.gas,aho:d.aho,inv:d.inv,res:d.res});
    Object.keys(T).forEach(k=>{T[k]+=d[k];});
    const per=perOf(y,i),liqN=r=>{const l=liqRef(m,r.src);return l?(l.c||'').trim():'';};
    const push=(sec,r,tipo,sent,concepto,cuenta,catg,sign)=>{
      const cur=rowCur(sec,r),tc=rateC(cur,m),amt=+r.m||0;
      if(cur!=='S/')fx.set(cur+'|'+per,{cur,per,tc});
      const sol=r2(amt*tc),o={sec,fecha:dayDate(y,i,r.f),y,i,dia:parseInt(r.f,10)||99,per,tipo,sent,concepto:(concepto||'').trim(),cat:catg||'',cuenta:cuenta||'',cur,amt,tc,sol,firm:sign?r2(sign*sol):sol};mov.push(o);return o;
    };
    (m.ing||[]).forEach(r=>{if(usedRow(r))push('ing',r,'Ingreso','Entrada',r.c,liqN(r),r.k,1);});
    (m.fij||[]).forEach(r=>{if(usedRow(r))push('fij',r,r.card?'Pago de tarjeta '+SECN[r.card]:'Gasto fijo','Salida',r.c,liqN(r),r.card?'Pago de tarjetas':(r.k||'Sin categoría'),-1);});
    (m.hor||[]).forEach(r=>{if(usedRow(r)){const an=r.t==='ant',o=push('hor',r,an?'Antojo':'Gasto variable','Salida',r.c,liqN(r),r.k||'Sin categoría',-1);if(an){o.ant=1;o.vp=r.v===1?'Sí':r.v===0?'No':'';}}});
    (m.inv||[]).forEach(r=>{if(usedRow(r))push('inv',r,'Inversión','Salida',r.c,liqN(r),r.k,-1);});
    (m.aho||[]).forEach(r=>{if(!usedRow(r))return;const k=ahoKind(r);
      const tipo={dep:'Depósito a ahorro',ret:'Retiro de ahorro',aj:'Ajuste de saldo de ahorro',tr:'Traspaso entre cuentas de ahorro'}[k];
      const sent={dep:'Hacia ahorro',ret:'Desde ahorro',aj:'Ajuste',tr:'Interno'}[k];
      push('aho',r,tipo,sent,r.k?'Meta: '+r.k:'',ahoName(r),'',(k==='dep'||k==='ret')?-1:0).ak=k;});
    CARDS.forEach(ck=>(m[ck]||[]).forEach(r=>{if(usedRow(r))push(ck,r,'Compra con tarjeta '+SECN[ck],'Cargo a tarjeta',r.c,'Tarjeta '+SECN[ck],r.k||'Sin categoría',-1);}));
  });
  mov.sort((p,q)=>mkey(p.y,p.i)-mkey(q.y,q.i)||p.dia-q.dia);
  Object.keys(T).forEach(k=>{T[k]=r2(T[k]);});
  /* Gastos por categoría (gastos fijos + variables, igual que «Total gastado») */
  const cm=new Map();mov.filter(x=>x.sec==='fij'||x.sec==='hor').forEach(x=>{const k=x.cat||'Sin categoría';cm.set(k,(cm.get(k)||0)+x.sol);});
  const cat=[...cm.entries()].map(([c,v])=>({c,v:r2(v)})).filter(x=>Math.abs(x.v)>=.005).sort((p,q)=>q.v-p.v);
  /* Gastos por grupo (Necesidades, Deseos, Ahorro e inversión), igual que «¿Dónde gastas más?» */
  const gm=gruposMes(ms.map(x=>x.m)),grupos=gm.G.map(g=>({n:g.n,t:r2(g.t),l:[...g.l.values()].map(e=>({c:e.n,v:r2(e.v)})).filter(e=>e.v>0).sort((p,q)=>q.v-p.v)})).filter(g=>g.t>0).sort((p,q)=>q.t-p.t),gT=r2(gm.total);
  /* Antojos y si valieron la pena */
  const antL=mov.filter(x=>x.ant).map(x=>({fecha:x.fecha,per:x.per,concepto:x.concepto||'Sin descripción',sol:x.sol,vp:x.vp})),
    ant={list:antL,tot:r2(antL.reduce((a,x)=>a+x.sol,0)),no:r2(antL.filter(x=>x.vp==='No').reduce((a,x)=>a+x.sol,0)),si:antL.filter(x=>x.vp==='Sí').length,pend:antL.filter(x=>!x.vp).length};
  /* Ahorros por cuenta: saldo inicial + movimientos del período = saldo final */
  const pk=mkey(first.y,first.i)-1,py=String(Math.floor(pk/12)),pi=((pk%12)+12)%12;
  const ini=new Map(),fin=new Map();
  (S[py]?ahoAccts(py,pi):[]).forEach(a=>ini.set(a.c.toLowerCase(),a));
  ahoAccts(last.y,last.i).forEach(a=>fin.set(a.c.toLowerCase(),a));
  const am=new Map(),acc=k=>{if(!am.has(k))am.set(k,{dep:0,ret:0,aj:0,tr:0});return am.get(k);};
  mov.filter(x=>x.sec==='aho').forEach(x=>{const a=acc(x.cuenta.toLowerCase()),k=x.ak;
    if(k==='dep')a.dep+=x.sol;else if(k==='ret')a.ret+=-x.sol;else a[k]+=x.sol;});
  const names=new Map();[...ini.values(),...fin.values()].forEach(a=>names.set(a.c.toLowerCase(),a.c));
  mov.filter(x=>x.sec==='aho').forEach(x=>{if(!names.has(x.cuenta.toLowerCase()))names.set(x.cuenta.toLowerCase(),x.cuenta);});
  const ahorros=[...names.entries()].map(([k,c])=>{const a=am.get(k)||{dep:0,ret:0,aj:0,tr:0},i0=(ini.get(k)||{v:0}).v,f0=(fin.get(k)||{v:0}).v,tz=tasaOf(c);
    return {c,ini:r2(i0),dep:r2(a.dep),ret:r2(a.ret),aj:r2(a.aj),tr:r2(a.tr),fin:r2(f0),tasa:tz?tz.t+' '+(+tz.v).toFixed(2)+'%':'',gana:r2(ahoGana(f0,tz,360))};})
    .filter(a=>[a.ini,a.dep,a.ret,a.aj,a.tr,a.fin].some(v=>Math.abs(v)>=.005)).sort((p,q)=>q.fin-p.fin);
  /* Tarjetas de crédito */
  const tarjetas=CARDS.map(ck=>{let cons=0,pag=0;ms.forEach(({m})=>{cons+=sumIn(m,ck);pag+=paymentsTo(m,ck);});const deuda=cardEnding(last.y,last.i,ck),cur=curOf(ck);
    return {k:ck,n:SECN[ck],cur,cons:r2(cons),pag:r2(pag),deuda:r2(deuda),deudaS:r2(deuda*rateC(cur,last.m))};}).filter(t=>t.cons||t.pag||t.deuda);
  const lc=curOf('liq'),liq=(last.m.liq||[]).filter(r=>(r.c||'').trim()).map(r=>({c:r.c.trim(),cur:lc,v:r2(r.m),s:r2((+r.m||0)*rateC(lc,last.m))}));
  const label=first===last?perOf(first.y,first.i):perOf(first.y,first.i)+' – '+perOf(last.y,last.i);
  return {first,last,label,mens,mov,T,cat,grupos,gT,ant,ahorros,tarjetas,liq,fx:[...fx.values()],
    ahoTot:r2(ahorros.reduce((s,a)=>s+a.fin,0)),deudaTot:r2(tarjetas.reduce((s,t)=>s+t.deudaS,0)),liqTot:r2(liq.reduce((s,l)=>s+l.s,0)),
    tasa:T.ing>0?(T.aho+T.inv)/T.ing:null};
}

/* Reportes en segundo plano: el armado de PDF y Excel (lo pesado) corre en un Web Worker (reportes.js)
   y la pantalla sigue respondiendo. Si el navegador no permite workers, se carga el mismo archivo y corre aquí. */
const REP_JS='reportes.js?v=4';
function mkReport(fmt,R,o){
  const ctx={MES,who:repWho(),lang:LANG},job={fmt,R,o:{det:o.det},ctx};
  const viaMain=()=>new Promise((res,rej)=>{
    if(window.MSRep)return res();
    const s=document.createElement('script');s.src=REP_JS;s.onload=()=>res();s.onerror=()=>{s.remove();rej(new Error('No pude cargar lo necesario para crear el reporte. Revisa tu conexión e intenta otra vez.'));};document.head.appendChild(s);
  }).then(()=>window.MSRep.build(job));
  if(!window.Worker)return viaMain();
  return new Promise((res,rej)=>{
    let w;try{w=new Worker(REP_JS);}catch(e){viaMain().then(res,rej);return;}
    w.onmessage=e=>{w.terminate();if(e.data.err)rej(new Error(e.data.err));else res(e.data.blob);};
    w.onerror=()=>{w.terminate();viaMain().then(res,rej);};
    w.postMessage(job);
  });
}

/* ---------- Tus datos: historial automático (30 días) y copia descargable ---------- */
const HKEY=KEY+'-hist',HDIAS=30;
const p2=n=>String(n).padStart(2,'0');
const hoyLima=()=>{const d=limaD();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
const snapNow=()=>({registro:toRows(true),config:[['cfg',JSON.stringify(cfg)],['layout',JSON.stringify(LAY)]]});
const useSbHist=()=>IS_SB&&sb&&sbUser;
function localHist(){try{const a=JSON.parse(localStorage.getItem(HKEY));return Array.isArray(a)?a:[];}catch(e){return [];}}
function localHistSet(a){a.sort((x,y)=>y.dia.localeCompare(x.dia)||x.tipo.localeCompare(y.tipo));
  for(let n=a.length;n>0;n--){try{localStorage.setItem(HKEY,JSON.stringify(a.slice(0,n)));return;}catch(e){}}}
function localKeep(tipo,s){const d=hoyLima(),lim=new Date(Date.parse(d)-HDIAS*864e5).toISOString().slice(0,10);
  const a=localHist().filter(h=>!(h.dia===d&&h.tipo===tipo)&&h.dia>=lim);a.push({dia:d,tipo,at:new Date().toISOString(),registro:s.registro,config:s.config});localHistSet(a);}
/* En la vista sin cuenta (demo) la copia diaria se guarda en este navegador; con cuenta la hace la base de datos sola. */
let lhT=0;function localDaily(){if(IS_SB)return;clearTimeout(lhT);lhT=setTimeout(()=>{try{localKeep('diaria',snapNow());HC=null;}catch(e){}},1500);}
let HC=null;

    return localHist().map(h=>({id:h.dia+'|'+h.tipo,dia:h.dia,tipo:h.tipo,filas:(h.registro||[]).length,created_at:h.at}));},

    localKeep(tipo,s);}
};

  if(d.capdel!==undefined){const a=d.capdel.split(':'),mi=(year===String(now.getFullYear()))?now.getMonth():0;delMov(S[year][mi],a[0],+a[1]);save();render();toast('Movimiento borrado');return;}
  if(d.act==='atasa'){const w=b.closest('.aa-t'),tz=tasaOf(d.acct);if(w){w.innerHTML='<div class="aa-te"><select class="aa-ts" aria-label="Tipo de tasa"><option value="TREA"'+(tz&&tz.t==='TEA'?'':' selected')+'>TREA</option><option value="TEA"'+(tz&&tz.t==='TEA'?' selected':'')+'>TEA</option></select><input class="aa-tv" type="text" inputmode="decimal" placeholder="Tasa anual %" value="'+(tz?esc(tz.v):'')+'" data-acct="'+esc(d.acct)+'" aria-label="Tasa anual en porcentaje"><button type="button" class="b p" data-act="atasasave" data-acct="'+esc(d.acct)+'">Guardar</button>'+(tz?'<button type="button" class="b" data-act="atasadel" data-acct="'+esc(d.acct)+'">Quitar</button>':'')+'</div><div class="ms aa-th">La TREA ya incluye comisiones y es la que mejor mide lo que ganas. Usa la TEA solo si tu banco no te muestra la TREA.</div>';const i=w.querySelector('input');i.focus();i.select();}return;}
  if(d.act==='atasasave'){const w=b.closest('.aa-t');saveTasa(d.acct,w.querySelector('.aa-ts').value,w.querySelector('.aa-tv').value);return;}
  if(d.act==='atasadel'){const k=String(d.acct).trim().toLowerCase();cfg.ahoTasa=Object.assign({},cfg.ahoTasa);delete cfg.ahoTasa[k];save();render();toast('Tasa quitada de '+d.acct);return;}
  if(d.act==='adel'){const nm=String(d.acct),yl=Object.keys(S).sort().pop(),a=ahoOf(yl,11,nm);
    if(a&&Math.abs(a.v)>=.005){toast(nm+' tiene '+fmt(a.v)+'. Retira o mueve ese dinero antes de quitarla.');return;}
    const prev=(cfg.ahoOcultas||[]).slice();cfg.ahoOcultas=prev.concat(nm.toLowerCase());save();render();
    toast('Cuenta quitada: '+nm,{fn:()=>{cfg.ahoOcultas=prev;}});return;}
  if(d.act==='aren'){const h=b.closest('.aa-h');if(h){h.innerHTML='<input class="aa-ren" type="text" value="'+esc(d.acct)+'" data-old="'+esc(d.acct)+'" aria-label="Nuevo nombre de la cuenta"><button type="button" class="b p" data-act="arensave" data-acct="'+esc(d.acct)+'">Guardar</button>';const i=h.querySelector('input');i.focus();i.select();}return;}
  if(d.act==='arensave'){const i=b.closest('.aa-h').querySelector('input');renameAho(d.acct,i?i.value:'');return;}
  if(d.act==='mover'){openSheet();ent.t='aho';ent.ax='mov';syncSheet();return;}
  if(d.act==='adep'||d.act==='aret'||d.act==='aadj'||d.act==='anew'){openSheet();ent.t='aho';ent.ax=d.act==='aret'?'ret':d.act==='adep'?'dep':'aj';ent.from=d.acct?'aho:'+d.acct:(d.act==='anew'?'aho:+':'');syncSheet();const sa=document.getElementById('sa');if(sa)sa.focus();return;}
  if(d.pay!==undefined){payRec(+d.pay);return;}
  if(d.vp!==undefined&&typeof view==='number'){const [ix,vv]=String(d.vp).split(':'),rw=S[year][view].hor[+ix];if(rw){const nv=+vv;if(rw.v===nv)delete rw.v;else rw.v=nv;save();render();}return;}
  if(d.act==='alta'){showOnboard(true);return;}
  if(d.act==='hist'){openHist(+d.i);return;}
  if(d.act==='cierre'){openCierre();return;}
  if(d.act==='liqedit'){liqEdit=!liqEdit;render();return;}
  if(d.act==='prev'){doPrev();return;}
  if(d.act==='rec'){doRec();return;}
  if(d.act==='rep'){openReport();return;}if(d.act==='cuad'){openCuadre();return;}
  if(d.recdel!==undefined){cfg.rec.splice(+d.recdel,1);save();render();return;}
  if(b.id==='rc-add'){const g=id=>document.getElementById(id),c=g('rc-c').value.trim(),m=parseMonto(g('rc-m').value);
    if(!c||!(m>0)){toast('Escribe el concepto y el monto del recurrente.');return;}
    cfg.rec=cfg.rec||[];cfg.rec.push({sec:g('rc-s').value,s:g('rc-s').value,c,m,k:g('rc-k').value,src:g('rc-src').value,f:Math.min(31,Math.max(1,+g('rc-d').value||1))});save();render();return;}
  if(b.id==='bk-json'){saveFile('mis-finanzas-copia-'+BK()+'.json',JSON.stringify({v:1,fecha:BK(),S,cfg,LAY},null,1)).then(()=>{const m=document.getElementById('bk-msg');if(m&&/^(Listo|Descargado|Done|Downloaded)/.test(m.textContent)){cfg.bkAt=Date.now();save();const a=document.getElementById('bk-age');if(a){const g=bkAge();a.textContent=g.txt;a.classList.toggle('bkw',g.warn);}}});return;}
  if(d.hist){if(d.hist==='ask')histAsk=d.hid;else if(d.hist==='no')histAsk=null;else if(d.hist==='mas')histOpen=!histOpen;else if(d.hist==='si'){histRestore(d.hid,b);return;}const h=document.getElementById('hist');if(h&&HC)h.innerHTML=histHtml(HC.l);return;}
  if(b.id==='bk-csv'){saveFile('mis-finanzas-movimientos-'+BK()+'.csv','\ufeff'+[REGHEAD].concat(toRows()).map(r=>r.map(csvCell).join(',')).join('\n'));return;}
  if(b.id==='bk-load'){document.getElementById('bk-file').click();return;}if(b.id==='imp-open'){document.getElementById('imp-file').click();return;}if(b.id==='imp-undo'){const u=impUltima();if(u&&confirm(T('¿Quitar los movimientos de la última importación? Los que editaste después se conservan.'))){const n=impQuitar(u.id);save();render();toast('Se quitaron '+n+' movimientos importados.');}return;}
  if(b.id==='nm-save'){const g=id=>document.getElementById(id);applyNames(liqNamesAll().map((_,j)=>g('nm-l'+j)?g('nm-l'+j).value:''),CARDS.map((_,j)=>g('nm-b'+j)?g('nm-b'+j).value:''));save();render();toast('Nombres guardados.');return;}
  if(b.id==='nm-addc'){const g=id=>document.getElementById(id),nm=g('nm-newc').value;if(CARDS.some(k=>BANKN[k].toLowerCase()===nm.trim().toLowerCase())){toast('Ya tienes una tarjeta con ese nombre.');return;}applyNames(liqNamesAll().map((_,j)=>g('nm-l'+j)?g('nm-l'+j).value:''),CARDS.map((_,j)=>g('nm-b'+j)?g('nm-b'+j).value:''));const k=cardAdd(nm);if(k){save();render();toast('Tarjeta agregada: '+BANKN[k]);}return;}
  if(b.dataset.cardrm){const k=b.dataset.cardrm;if(cardHas(k)){toast('Esta tarjeta tiene movimientos o deuda. Bórralos antes de quitarla.');return;}if(confirm(T('¿Quitar esta tarjeta? No tiene movimientos ni deuda.'))&&cardRm(k)){save();render();toast('Tarjeta quitada.');}return;}
  if(b.id==='nm-addl'){const g=id=>document.getElementById(id);const nm=g('nm-newl').value;applyNames(liqNamesAll().map((_,j)=>g('nm-l'+j)?g('nm-l'+j).value:''),CARDS.map((_,j)=>g('nm-b'+j)?g('nm-b'+j).value:''));if(liqAdd(nm)){save();render();toast('Cuenta agregada: '+(cfg.liqNames[cfg.liqNames.length-1]));}return;}
  if(b.dataset&&b.dataset.metasug){const a=avgGasto(),g=id=>document.getElementById(id);if(!g('mn').value.trim())g('mn').value=(cfg.metas&&cfg.metas[0])?cfg.metas[0].n:'Fondo de emergencia';g('mobj').value=Math.round(a*(+b.dataset.metasug));g('mobj').focus();return;}
  if(b.id==='sb-logout'){sbLogout();return;}if(b.id==='rec-on'){recActivar();return;}if(b.id==='rec-off'){recDesactivar();return;}if(b.id==='mfa-on'){showMfaEnroll();return;}if(b.id==='mfa-off'){showMfaOff();return;}
  if(b.id==='del-go'){sbDelete(b);return;}
  if(b.id==='fx-now'||b.id==='tcm-sunat'){fxUpdate(true);return;}
  if(b.id==='gs-load'){if((sync.dirty||sync.state==='conflict')&&!confirm(T('Tienes cambios en este dispositivo que todavía no se subieron. Si recargas, se reemplazan por los de tu cuenta. ¿Recargar igual?')))return;loadFromSheet();return;}
  if(b.id==='gs-push'){if(sync.state==='conflict'&&!confirm(T('Tu cuenta tiene cambios hechos desde otro dispositivo. Si guardas ahora, se reemplazan por los de aquí. ¿Guardar igual?')))return;pushNow(true);return;}
  if(d.cfgcard){openPanel(d.cfgcard,b);return;}
  if(d.show){cs(d.show).hide=false;saveLay();render();return;}
  if(d.undel){delete cs(d.undel).del;saveLay();render();return;}
  if(b.id==='ldone'){edit=false;closePanel();render();return;}
  if(b.id==='lreset'){delete LAY[grp()];saveLay();closePanel();render();return;}
  if(d.add&&typeof view==='number'){const arr=S[year][view][d.add];arr.push(d.add==='eur'?{a:0,b:0,d:0,s:0,p:0}:row());pf=[d.add,arr.length-1,d.add==='eur'?'a':'c'];save();render();}
  else if(d.del&&typeof view==='number'){delMov(S[year][view],d.del,+d.i);save();render();}
  else if(d.cat!==undefined){const nm0=cfg.cats[+d.cat];if(nm0&&catCuenta(nm0)>0){toast('Tiene movimientos. Para quitarla, únela con otra escribiendo su nombre.');return;}const nm=cfg.cats.splice(+d.cat,1)[0];if(nm&&cfg.catGrupo)delete cfg.catGrupo[nm.trim().toLowerCase()];save();render();}
  else if(b.id==='addcat'){const v=catNom(document.getElementById('nc').value);if(v&&catFind(v)){toast('Ya tienes esa categoría.');return;}if(v){cfg.cats.push(v);const gv=(document.getElementById('nc-g')||{}).value;if(gv&&gv!=='-'){cfg.catGrupo=cfg.catGrupo||{};cfg.catGrupo[v.toLowerCase()]=gv;}save();}render();}
  else if(b.id==='addmeta'){const n=document.getElementById('mn').value.trim(),o=parseFloat(document.getElementById('mobj').value)||0;if(!n){toast('Escribe el nombre de la meta.');return;}cfg.metas=cfg.metas||[];const ex=cfg.metas.find(x=>x.n.toLowerCase()===n.toLowerCase());if(ex){if(o>0){ex.o=o;save();render();toast('Objetivo actualizado.');}else toast('Ya existe esa meta. Escribe un objetivo para actualizarla.');return;}cfg.metas.push({n,o});save();render();}
  else if(d.metadel!==undefined){cfg.metas.splice(+d.metadel,1);save();render();return;}
  else if(b.id==='reset'){S=build();cfg=CFG0();save();render();}
});
app.addEventListener('keydown',e=>{const t=e.target;if(t.classList&&t.classList.contains('aa-tv')){if(e.key==='Enter'){e.preventDefault();saveTasa(t.dataset.acct,t.closest('.aa-t').querySelector('.aa-ts').value,t.value);}else if(e.key==='Escape'){e.preventDefault();render();}return;}
  if(!t.classList||!t.classList.contains('aa-ren'))return;if(e.key==='Enter'){e.preventDefault();renameAho(t.dataset.old,t.value);}else if(e.key==='Escape'){e.preventDefault();render();}});
app.addEventListener('submit',e=>{
  if(e.target.id!=='qa')return;e.preventDefault();
  const q=document.getElementById('qi'),r=quickAdd(q.value.trim());
  if(r.err){const m=document.getElementById('qm');m.textContent=r.err;m.className='qm err';return;}

app.addEventListener('keydown',e=>{
  const t=e.target;if(e.key!=='Enter'||e.isComposing||t.tagName!=='INPUT'||!t.dataset||!t.dataset.s||typeof view!=='number')return;
  if(t.dataset.k==='c'){const row=t.closest('.rw'),ins=row?[...row.querySelectorAll('input')]:[],nx=ins[ins.indexOf(t)+1];if(nx){e.preventDefault();nx.focus();if(nx.select)nx.select();}return;}

  e.preventDefault();const sc=t.dataset.s,i=+t.dataset.i,arr=S[year][view][sc];

});
app.addEventListener('pointerdown',e=>{
  if(!edit||(e.pointerType==='mouse'&&e.button!==0))return;
  const g=e.target.closest('[data-drag]'),r=e.target.closest('[data-rz]');if(!g&&!r)return;

document.addEventListener('click',e=>{
  const p=document.getElementById('cpanel');if(!p)return;
  const pc=e.target.closest('[data-pc]');
  if(pc&&p.contains(pc)){
    const id=p.dataset.id,k=pc.dataset.pc;
    if(k==='hide'){cs(id).hide=true;saveLay();closePanel();render();}
    else if(k==='reset'){delete L().c[id];saveLay();closePanel();render();}
    else if(k==='del'){
      if(pc.dataset.arm){cs(id).del=true;saveLay();closePanel();render();}
      else{pc.dataset.arm='1';pc.textContent='Confirmar eliminar';pc.classList.add('danger');}
    }
    else closePanel();
    return;
  }
  if(!p.contains(e.target)&&!e.target.closest('[data-cfgcard]'))closePanel();
});
function panelField(e,live){
  const t=e.target,p=document.getElementById('cpanel');
  if(!p||!p.contains(t)||!t.dataset.pf)return;
  const id=p.dataset.id,k=t.dataset.pf,s=cs(id);
  if(k==='t'){
    if(!live)return;
    s.t=t.value.trim()||undefined;saveLay();
    const el=document.querySelector('.bcard[data-cid="'+id+'"] .ttl');if(el)el.textContent=s.t||CNAME[id]||'';
    return;
  }
  if(live)return;
  if(k==='w')s.w=+t.value;
  else if(k==='h'){if(+t.value)s.h=+t.value;else delete s.h;}
  else if(k==='ty')s.ty=t.value;
  else if(k==='cur'){if(t.value==='S/')delete s.cur;else s.cur=t.value;}
  saveLay();render();
}
document.addEventListener('input',e=>panelField(e,true));
document.addEventListener('change',e=>panelField(e,false));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});
/* Atajos de teclado. Los de una sola tecla se pueden apagar en Ajustes (accesibilidad, WCAG 2.1.4). Preferencia del dispositivo. */
function openAtajos(){
  closeSheet();closePanel();sheetFrom=document.activeElement;
  const bg=document.createElement('div');bg.id='sheetbg';bg.className='sheetbg';
  const sh=document.createElement('div');sh.id='sheet';sh.className='sheet';sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');sh.setAttribute('aria-label','Atajos de teclado');
  const filas=[['N','Registrar un movimiento'],['← →','Mes anterior o siguiente'],['R','Ir al resumen del año'],['?','Ver estos atajos'],['Esc','Cerrar la ventana'],['Ctrl + Enter','Guardar al registrar'],['Ctrl + Z','Deshacer lo último']];
  sh.innerHTML='<div class="sh-h"><b>Atajos de teclado</b><button type="button" data-s="close" aria-label="Cerrar">×</button></div><dl class="atk">'+filas.map(f=>'<div><dt><kbd>'+f[0]+'</kbd></dt><dd>'+f[1]+'</dd></div>').join('')+'</dl><div class="ms">Puedes apagarlos en Ajustes.</div>';
  document.body.append(bg,sh);sh.querySelector('button').focus();
  bg.addEventListener('click',closeSheet);sh.addEventListener('click',e=>{if(e.target.closest('[data-s="close"]'))closeSheet();});
  sh.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
}
document.addEventListener('keydown',e=>{
  if(e.defaultPrevented||e.isComposing||e.ctrlKey||e.metaKey||e.altKey||!atajosOn())return;
  const t=e.target;if(t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"],[role=radiogroup],[role=tablist],[role=listbox],[role=slider]'))return;
  if(document.querySelector('#sheet,#cpanel,.authbg,#onbg,#impbg,#tabwarn'))return;
  const k=e.key;
  if(k==='n'||k==='N'){if(e.repeat)return;e.preventDefault();openSheet(true);const c=document.querySelector('.caplink');if(c)sheetFrom=c;}
  else if(k==='r'||k==='R'){if(e.repeat)return;e.preventDefault();location.hash='resumen';}
  else if((k==='ArrowLeft'||k==='ArrowRight')&&!e.shiftKey&&typeof view==='number'){const j=view+(k==='ArrowRight'?1:-1);if(j>=0&&j<12){e.preventDefault();location.hash=SLUG[j];}}
  else if(k==='?'){e.preventDefault();openAtajos();}
});

})();
